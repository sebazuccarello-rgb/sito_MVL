<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVL // SCAN\THE_VAULT</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a09;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      background: rgba(10,10,9,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      height: 52px;
    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .back-link { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); transition: color 0.2s; }
    .back-link:hover { color: var(--teal); }
    .page-title { font-family: 'Prototype', var(--font); font-size: 12px; letter-spacing: 0.28em; color: var(--red); }
    .separator { color: var(--text-dim); }
    .header-right { font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim); }

    /* ── PAGE BODY ── */
    .vault-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-top: 52px;
    }

    /* ── TOP LABEL ── */
    .vault-top-label {
      padding: 18px 40px 12px;
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-shrink: 0;
    }
    .vault-archive-title {
      font-family: 'Prototype', var(--font);
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .vault-final-work {
      font-family: 'Prototype', var(--font);
      font-size: 32px;
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1;
    }
    .vault-final-work span { color: var(--teal); }
    .vault-count {
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--text-dim);
      margin-left: auto;
    }

    /* ── FOLDERS ROW ── */
    .folders-row {
      flex: 1;
      display: flex;
      align-items: stretch;
      padding: 0 40px 32px;
      overflow: hidden;
    }

    /* ── FOLDER CARD ── */
    .folder-card {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94), z-index 0s;
      margin-right: -28px; /* overlap */
      z-index: 1;
    }
    .folder-card:last-child { margin-right: 0; }
    .folder-card:hover {
      transform: translateY(-44px);
      z-index: 50;
    }

    /* ── TAB ── */
    .folder-tab {
      flex-shrink: 0;
      height: 64px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #131312;
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom: none;
      clip-path: polygon(0 18px, 18px 0, 100% 0, 100% 100%, 0 100%);
      transition: background 0.25s;
    }
    .folder-card:hover .folder-tab { background: #1a1a18; }

    .tab-code {
      font-size: 7px;
      letter-spacing: 0.28em;
      color: var(--teal);
    }
    .tab-name {
      font-family: 'Prototype', var(--font);
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── CARD BODY ── */
    .folder-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      border-top: none;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.4) brightness(0.55);
      transition: filter 0.4s;
    }
    .folder-card:hover .card-bg { filter: saturate(0.8) brightness(0.82); }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.08) 55%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 18px;
    }

    /* large faded name */
    .card-project-bg-name {
      font-family: 'Prototype', var(--font);
      font-size: clamp(20px, 3.5vw, 48px);
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.07);
      text-transform: uppercase;
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      align-self: flex-end;
      line-height: 1;
      pointer-events: none;
      transition: color 0.35s;
    }
    .folder-card:hover .card-project-bg-name { color: rgba(255,255,255,0.32); }

    .card-bottom {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .card-title {
      font-family: 'Prototype', var(--font);
      font-size: 16px;
      letter-spacing: 0.1em;
      color: #fff;
      text-transform: uppercase;
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .card-tag {
      font-size: 6px;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 2px 6px;
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal { position: relative; width: 88vw; max-width: 1000px; }
    .modal video { width: 100%; display: block; }
    .modal-close {
      position: absolute;
      top: -30px; right: 0;
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.2s;
    }
    .modal-close:hover { color: var(--red); }
    .modal-title {
      margin-top: 10px;
      font-family: 'Prototype', var(--font);
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link">← [HOME]</a>
      <span class="separator">//</span>
      <span class="page-title">[SCAN\\THE_VAULT]</span>
    </div>
    <div class="header-right" id="version-tag">[Version\1.0.0]</div>
  </header>

  <div class="vault-page">

    <div class="vault-top-label">
      <div>
        <div class="vault-archive-title">ARCHIVE_LOG //</div>
        <div class="vault-final-work">FINAL_WORK <span id="work-count">_01</span></div>
      </div>
      <div class="vault-count">// COMPLETED RENDERS &amp; VIDEOS</div>
    </div>

    <div class="folders-row" id="folders-row">

      <!-- OAKLEY -->
      <div class="folder-card" onclick="openModal('oakley')">
        <div class="folder-tab">
          <span class="tab-code">CODE_001 //</span>
          <span class="tab-name">OAKLEY</span>
        </div>
        <div class="folder-body">
          <video class="card-bg" src="projects/vault/oakley/video.mp4"
                 muted playsinline preload="metadata" id="prev-oakley"></video>
          <div class="card-overlay">
            <div class="card-project-bg-name">OAKLEY</div>
            <div class="card-bottom">
              <div class="card-title">OAKLEY</div>
              <div class="card-tags">
                <span class="card-tag">3D</span>
                <span class="card-tag">SPOT</span>
                <span class="card-tag">VIDEO</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- VIDEO MODAL -->
  <div class="modal-overlay" id="modal-oakley">
    <div class="modal">
      <div class="modal-close" onclick="closeModal('oakley')">[✕ CLOSE]</div>
      <video src="projects/vault/oakley/video.mp4" controls></video>
      <div class="modal-title">CODE_001 // OAKLEY — SPOT PROMOZIONALE</div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    /* 5-second looping preview on hover */
    document.querySelectorAll('.folder-card').forEach(card => {
      const v = card.querySelector('.card-bg');
      if (!v) return;

      v.addEventListener('loadedmetadata', () => { v.currentTime = 0; });

      v.addEventListener('timeupdate', () => {
        if (v.currentTime >= 5) { v.currentTime = 0; }
      });

      card.addEventListener('mouseenter', () => {
        v.currentTime = 0;
        v.play();
      });
      card.addEventListener('mouseleave', () => {
        v.pause();
        v.currentTime = 0;
      });
    });

    function openModal(id) {
      const o = document.getElementById('modal-' + id);
      o.classList.add('active');
      o.querySelector('video').play();
    }
    function closeModal(id) {
      const o = document.getElementById('modal-' + id);
      o.classList.remove('active');
      o.querySelector('video').pause();
    }
    document.querySelectorAll('.modal-overlay').forEach(o => {
      o.addEventListener('click', e => {
        if (e.target === o) closeModal(o.id.replace('modal-', ''));
      });
    });
  </script>
</body>
</html>
