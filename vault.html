<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MVL // SCAN\THE_VAULT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <style>
    @property --g1x { syntax: '<percentage>'; inherits: false; initial-value:  20%; }
    @property --g1y { syntax: '<percentage>'; inherits: false; initial-value:   0%; }
    @property --g2x { syntax: '<percentage>'; inherits: false; initial-value:  80%; }
    @property --g2y { syntax: '<percentage>'; inherits: false; initial-value: 100%; }
    @keyframes bg-drift {
      0%   { --g1x: 20%; --g1y: 100%; --g2x: 80%; --g2y:   0%; }
      25%  { --g1x: 78%; --g1y:  72%; --g2x: 12%; --g2y:  38%; }
      50%  { --g1x: 38%; --g1y:  18%; --g2x: 68%; --g2y:  82%; }
      75%  { --g1x:  6%; --g1y:  48%; --g2x: 92%; --g2y:  58%; }
      100% { --g1x: 20%; --g1y: 100%; --g2x: 80%; --g2y:   0%; }
    }
    #dust-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    html { min-height: 100%; }
    body {
      min-height: 100vh;
      background-color: #080808;
      background-image:
        radial-gradient(ellipse at var(--g1x) var(--g1y), rgba(0,90,100,0.30) 0%, transparent 58%),
        radial-gradient(ellipse at var(--g2x) var(--g2y), rgba(140,20,20,0.24) 0%, transparent 54%);
      animation: bg-drift 18s ease-in-out infinite;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      background: rgba(10,10,9,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      height: 52px;
    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .back-link { font-size: 13px; letter-spacing: 0.18em; color: var(--text-dim); transition: color 0.2s; }
    .back-link:hover { color: var(--teal); }
    .page-title { font-family: 'Prototype', var(--font); font-size: 12px; letter-spacing: 0.28em; color: var(--red); }
    .separator { color: var(--text-dim); }
    .header-right { font-size: 13px; letter-spacing: 0.14em; color: var(--text-dim); }

    /* ── PAGE BODY ── */
    .vault-page { padding-top: 52px; }

    /* ── TOP LABEL ── */
    .vault-top-label {
      padding: 24px 40px 20px;
      display: flex;
      align-items: baseline;
      gap: 20px;
    }
    .vault-archive-title {
      font-family: 'Prototype', var(--font);
      font-size: 13px;
      letter-spacing: 0.3em;
      color: #fff;
    }
    .vault-final-work {
      font-family: 'Prototype', var(--font);
      font-size: 32px;
      letter-spacing: 0.12em;
      color: var(--text);
      line-height: 1;
    }
    .vault-count {
      font-size: 9px;
      letter-spacing: 0.22em;
      color: #fff;
      margin-left: auto;
    }

    /* ── BACK BUTTON ── */
    .back-to-vault {
      font-family: var(--font);
      font-size: 9px;
      letter-spacing: 0.24em;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }
    .back-to-vault:hover { color: var(--teal); }

    /* ══════════════════════════════════
       VAULT GRID — 4 group cards mosaic
       (identico a laboratory)
    ══════════════════════════════════ */
    .vault-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 6px;
      padding: 0 40px 120px;
    }
    .vault-grid .fc { height: 340px; }

    /* ── FC CARD (mosaic card, lab-style) ── */
    .fc {
      position: relative;
      background: #060606;
      border: 7px solid #000;
      box-shadow: 1px 2px 10px rgba(0,0,0,0.7);
      overflow: hidden;
      cursor: pointer;
      transform-origin: center;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .fc:hover {
      transform: scale(1.06);
      border-color: #333;
      box-shadow: 0 6px 32px rgba(0,0,0,0.95);
      z-index: 20;
    }
    .card-media {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.4) brightness(0.6);
      transition: filter 0.35s;
    }
    .fc:hover .card-media { filter: saturate(0.8) brightness(0.82); }
    .card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      z-index: 2;
    }
    .card-code { font-size: 6px; letter-spacing: 0.25em; color: var(--teal); margin-bottom: 2px; }
    .card-name {
      font-family: 'Prototype', var(--font);
      font-size: 10px; letter-spacing: 0.1em;
      color: var(--text); text-transform: uppercase;
    }
    .card-status { margin-top: 3px; display: flex; align-items: center; gap: 5px; }
    .status-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 4px var(--red);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-text { font-size: 6px; letter-spacing: 0.2em; color: var(--text-dim); }

    /* ── GLITCH CLICK ── */
    @keyframes fc-glitch {
      0%   { transform: scale(1.06) translate(0,0);      clip-path: none;               filter: brightness(1); }
      10%  { transform: scale(1.06) translate(-5px,2px); clip-path: inset(6% 0 90% 0);  filter: brightness(3) saturate(0); }
      20%  { transform: scale(1.06) translate(5px,-2px); clip-path: none;               filter: brightness(0.3); }
      30%  { transform: scale(1.06) translate(-4px,3px); clip-path: inset(52% 0 32% 0); filter: brightness(2.5) hue-rotate(80deg); }
      40%  { transform: scale(1.06) translate(0,0);      clip-path: none;               filter: brightness(1); }
      50%  { transform: scale(1.06) translate(4px,-1px); clip-path: inset(72% 0 8% 0);  filter: brightness(1.8) saturate(0); }
      60%  { transform: scale(1.06) translate(-3px,0);   clip-path: none;               filter: brightness(0.5); }
      70%  { transform: scale(1.06) translate(3px,3px);  clip-path: inset(18% 0 72% 0); filter: brightness(2); }
      80%  { transform: scale(1.06) translate(0,0);      clip-path: none;               filter: brightness(1); }
      100% { transform: scale(1);                        clip-path: none;               filter: brightness(1); }
    }
    .fc.glitching {
      animation: fc-glitch 0.42s steps(1) forwards !important;
      transition: none !important;
      z-index: 50;
      pointer-events: none;
    }

    /* ══════════════════════════════════
       FOLDERS STACK — project cards
       inside each group
    ══════════════════════════════════ */
    .folders-row {
      display: flex;
      flex-direction: column;
      padding: 36px 40px 140px;
    }

    /* ── FOLDER CARD (singolo progetto) ── */
    .folder-card {
      width: 100%;
      height: 420px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      /* SPRING "sfilamento" — overshoot leggero */
      transition: transform 0.55s cubic-bezier(0.34,1.4,0.64,1),
                  box-shadow 0.35s ease;
      margin-top: -220px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .folder-card:first-child { margin-top: 0; }
    .folder-card:hover {
      transform: translateY(-80px);
      z-index: 50;
      box-shadow: 0 24px 64px rgba(0,0,0,0.85);
    }

    /* ── TAB ── */
    .folder-tab {
      flex-shrink: 0;
      height: 56px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: #131312;
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom: none;
      transition: background 0.25s;
    }
    .folder-card:hover .folder-tab { background: #1c1c1a; }

    .tab-code { font-size: 8px; letter-spacing: 0.28em; color: var(--teal); white-space: nowrap; }
    .tab-name {
      font-family: 'Prototype', var(--font);
      font-size: 13px;
      letter-spacing: 0.16em;
      color: var(--text);
      text-transform: uppercase;
    }
    .tab-arrow {
      margin-left: auto;
      font-size: 14px;
      color: var(--text-dim);
      transition: color 0.25s, transform 0.4s cubic-bezier(0.34,1.4,0.64,1);
    }
    .folder-card:hover .tab-arrow { color: var(--teal); transform: translateX(6px); }

    /* ── CARD BODY ── */
    .folder-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      border-top: none;
    }
    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.35) brightness(0.5);
      transition: filter 0.4s;
    }
    .folder-card:hover .card-bg { filter: saturate(0.75) brightness(0.78); }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.1) 60%);
      display: flex;
      align-items: flex-end;
      padding: 28px 32px;
    }
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .card-tag {
      font-size: 7px;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 3px 8px;
    }

    /* ══════════════════════════════════
       GROUP VIEW
    ══════════════════════════════════ */
    #vault-group-view { display: none; }
    .group-page { display: none; }
    .group-page.active { display: block; }

    /* ── BOTTOM SWITCHER ── */
    .group-switcher {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 300;
      display: flex;
      background: rgba(8,8,8,0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }
    .switcher-btn {
      flex: 1;
      font-family: 'Prototype', var(--font);
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--text-dim);
      background: transparent;
      border: none;
      border-right: 1px solid var(--border);
      padding: 14px 8px 12px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .switcher-btn:last-child { border-right: none; }
    .switcher-btn:hover { color: var(--teal); background: rgba(0,180,200,0.04); }
    .switcher-btn.active { color: var(--teal); background: rgba(0,180,200,0.08); }
    .switcher-btn .sw-count {
      font-size: 7px;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      font-family: var(--font);
    }
    .switcher-btn.active .sw-count { color: var(--teal); }

    /* ══════════════════════════════════
       PROJECT VIEW — singola pagina
    ══════════════════════════════════ */
    #vault-project-view { display: none; }

    .proj-hero {
      padding: 0 40px 48px;
    }
    .proj-hero video,
    .proj-hero img {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* descrizione / meta progetto */
    .proj-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 0 0;
      flex-wrap: wrap;
    }
    .proj-meta-tag {
      font-size: 7px;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 3px 9px;
    }

    /* WIP section */
    .proj-section-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #fff;
      padding: 0 40px 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .proj-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .wip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 0 40px 160px;
    }
    .wip-card {
      aspect-ratio: 16/9;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.015);
      transition: border-color 0.25s;
    }
    .wip-card:hover { border-color: rgba(0,180,200,0.3); }
    .wip-media {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.4) brightness(0.6);
      transition: filter 0.35s;
    }
    .wip-card:hover .wip-media { filter: saturate(0.75) brightness(0.8); }

    .wip-3d-thumb {
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,180,200,0.04);
      border: 1px solid rgba(0,180,200,0.15);
    }

    .vault-3d-container {
      width: 100%; height: 65vh;
      background: #0d0d0d;
      position: relative;
    }

    /* placeholder step quando src è null */
    .wip-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
    }
    .wip-placeholder-code { font-size: 7px; letter-spacing: 0.3em; color: #252525; }
    .wip-placeholder-status { font-size: 6px; letter-spacing: 0.2em; color: #1a1a1a; }

    .wip-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.94));
    }
    .wip-step  { font-size: 6px; letter-spacing: 0.28em; color: var(--teal); margin-bottom: 2px; }
    .wip-desc  {
      font-family: 'Prototype', var(--font);
      font-size: 9px; letter-spacing: 0.12em;
      color: var(--text); text-transform: uppercase;
    }

    /* ── TABLET (769–1100px) ── */
    @media (max-width: 1100px) {
      .vault-grid { padding: 0 24px 120px; }
      .wip-grid { grid-template-columns: repeat(3, 1fr); padding: 0 24px 160px; }
      .folders-row { padding: 36px 24px 140px; }
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      header { padding: 12px 16px; height: auto; }
      .vault-page { padding-top: 52px; }
      .vault-top-label { padding: 16px 16px 12px; flex-wrap: wrap; gap: 8px; }
      .vault-final-work { font-size: 22px; }
      .vault-count { margin-left: 0; }

      /* vault main grid */
      .vault-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 44vw;
        padding: 0 12px 120px;
      }
      .vault-grid .fc { grid-column: span 1 !important; grid-row: span 1 !important; }

      /* group pages */
      .folders-row { padding: 12px 12px 140px; }
      .folder-card { height: 240px; margin-top: -120px; }
      .folder-card:hover { transform: translateY(-40px); }
      .tab-name { font-size: 11px; }
      .switcher-btn { font-size: 8px; padding: 10px 4px; }

      /* project view */
      .proj-hero { padding: 0 12px 20px; }
      .proj-hero video, .proj-hero img { max-height: 55vw; }
      .proj-section-label { padding: 0 12px 16px; }
      .wip-grid { grid-template-columns: repeat(2, 1fr); padding: 0 12px 160px; }
    }

    /* ── EXTRA SMALL (≤380px) ── */
    @media (max-width: 380px) {
      .wip-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }
  </style>
</head>
<body>

  <canvas id="dust-canvas"></canvas>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link"><img src="assets/1x/Risorsa 5.png" alt="MVL" class="header-logo"></a>
      <span class="separator">//</span>
      <span class="page-title" id="header-page-title">[SCAN\\THE_VAULT]</span>
    </div>
  </header>

  <!-- ══════════════════════════════════════════
       MAIN VIEW — 4 group cards mosaic
  ══════════════════════════════════════════ -->
  <div id="vault-main" class="vault-page">
    <div class="vault-top-label">
      <div>
        <div class="vault-archive-title">ARCHIVE_LOG //</div>
        <div class="vault-final-work">THE_VAULT</div>
      </div>
      <div class="vault-count">// 4 CATEGORIES</div>
    </div>

    <div class="vault-grid" id="vault-main-grid">
      <!-- popolato dinamicamente da JS tramite VAULT_PROJECTS -->
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       GROUP VIEW — projects of selected group
  ══════════════════════════════════════════ -->
  <div id="vault-group-view" class="vault-page">
    <div class="vault-top-label">
      <div>
        <button class="back-to-vault" onclick="backToVault()">← THE_VAULT</button>
        <div class="vault-archive-title" id="grp-label"></div>
        <div class="vault-final-work" id="grp-title"></div>
      </div>
      <div class="vault-count" id="grp-count"></div>
    </div>

    <!-- group-pages e switcher popolati dinamicamente da JS -->
    <div id="group-pages-container"></div>
    <div class="group-switcher" id="group-switcher"></div>
  </div>

  <!-- ══════════════════════════════════════════
       PROJECT VIEW — singola pagina progetto
  ══════════════════════════════════════════ -->
  <div id="vault-project-view" class="vault-page">
    <div class="vault-top-label">
      <div>
        <button class="back-to-vault" id="proj-back-btn" onclick="backToGroup()">← BACK</button>
        <div class="vault-archive-title" id="proj-code"></div>
        <div class="vault-final-work" id="proj-name"></div>
      </div>
      <div class="vault-count" id="proj-tags-display"></div>
    </div>

    <!-- media principale -->
    <div class="proj-hero">
      <div id="proj-media-wrap"></div>
    </div>

    <!-- WIP steps -->
    <div class="proj-section-label">// WIP_LOG</div>
    <div class="wip-grid" id="wip-grid"></div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/dust.js"></script>
  <script src="js/projects.js"></script>
  <script type="module" src="js/viewer3d.js"></script>
  <script>
    let currentGroup = null;
    const CATEGORIES = Object.keys(VAULT_PROJECTS);

    /* ── popola vault main grid dinamicamente ── */
    const mainGrid = document.getElementById('vault-main-grid');
    if (CATEGORIES.length === 0) {
      mainGrid.innerHTML = `<div style="grid-column:1/-1;padding:80px 0;text-align:center;font-size:11px;letter-spacing:0.3em;color:var(--text-dim)">// THE VAULT IS EMPTY — ADD FILES AND RUN SYNC.BAT</div>`;
    } else {
      mainGrid.innerHTML = CATEGORIES.map((cat, i) => {
        const n = VAULT_PROJECTS[cat].length;
        return `
          <div class="fc" onclick="glitchOpen(this,'${cat}')">
            <div class="card-info">
              <div class="card-code">GRP_${String(i+1).padStart(3,'0')} //</div>
              <div class="card-name">${cat}</div>
              <div class="card-status"><div class="status-dot"></div><span class="status-text">${n} PROJECT${n!==1?'S':''}</span></div>
            </div>
          </div>`;
      }).join('');
    }

    /* ── popola group-pages e switcher dinamicamente ── */
    const groupContainer = document.getElementById('group-pages-container');
    const switcherEl     = document.getElementById('group-switcher');
    groupContainer.innerHTML = CATEGORIES.map(cat =>
      `<div class="group-page folders-row" data-group="${cat}"></div>`
    ).join('');
    switcherEl.innerHTML = CATEGORIES.map(cat => {
      const n = VAULT_PROJECTS[cat].length;
      return `<button class="switcher-btn" data-group="${cat}" onclick="openGroup('${cat}')">${cat}<span class="sw-count">${n}</span></button>`;
    }).join('');

    /* ── glitch → openGroup ── */
    function glitchOpen(card, groupId) {
      if (card.classList.contains('glitching')) return;
      card.classList.add('glitching');
      setTimeout(() => { card.classList.remove('glitching'); openGroup(groupId); }, 420);
    }

    /* ── apri gruppo ── */
    function openGroup(id) {
      currentGroup = id;
      const projects = VAULT_PROJECTS[id] || [];
      const n = projects.length;

      document.getElementById('grp-label').textContent = id + ' //';
      document.getElementById('grp-title').textContent = id;
      document.getElementById('grp-count').textContent = '// ' + n + ' PROJECT' + (n !== 1 ? 'S' : '');

      const groupPage = document.querySelector('.group-page[data-group="' + id + '"]');
      groupPage.innerHTML = n === 0
        ? `<div style="padding:80px 0;text-align:center;font-size:11px;letter-spacing:0.3em;color:var(--text-dim)">// NO FILES IN THIS CATEGORY YET</div>`
        : projects.map(p => {
            const mediaBg = p.type === 'video'
              ? `<video class="card-bg" data-src="${p.src}" muted playsinline preload="none" loop></video>`
              : `<img class="card-bg" src="${p.src}" alt="${p.name}" loading="lazy">`;
            return `
              <div class="folder-card" onclick="openProject('${p.id}')">
                <div class="folder-tab">
                  <span class="tab-code">${p.code} //</span>
                  <span class="tab-name">${p.name}</span>
                  <span class="tab-arrow">→</span>
                </div>
                <div class="folder-body">
                  ${mediaBg}
                  <div class="card-overlay">
                    <div class="overlay-tag">${p.tags.join(' — ')}</div>
                  </div>
                </div>
              </div>`;
          }).join('');

      document.querySelectorAll('.group-page').forEach(p => p.classList.remove('active'));
      groupPage.classList.add('active');
      document.querySelectorAll('.switcher-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.group === id)
      );

      document.getElementById('vault-main').style.display         = 'none';
      document.getElementById('vault-project-view').style.display = 'none';
      document.getElementById('vault-group-view').style.display   = 'block';

      initCards();
      window.scrollTo(0, 0);
    }

    /* ── torna alla vault main ── */
    function backToVault() {
      stopProjectMedia();
      document.getElementById('vault-group-view').style.display   = 'none';
      document.getElementById('vault-project-view').style.display = 'none';
      document.getElementById('vault-main').style.display         = 'block';
      window.scrollTo(0, 0);
    }

    /* ── apri pagina singolo progetto ── */
    function openProject(id) {
      let p = null;
      for (const cat of Object.keys(VAULT_PROJECTS)) {
        p = VAULT_PROJECTS[cat].find(proj => proj.id === id);
        if (p) break;
      }
      if (!p) return;
      currentGroup = p.group;

      /* header */
      document.getElementById('proj-code').textContent         = p.code + ' //';
      document.getElementById('proj-name').textContent         = p.name;
      document.getElementById('proj-tags-display').textContent = p.tags.join('  —  ');
      document.getElementById('proj-back-btn').textContent     = '← ' + p.group.toUpperCase();
      document.getElementById('header-page-title').textContent = '[' + p.code + '\\\\' + p.name + ']';

      /* media principale */
      const wrap = document.getElementById('proj-media-wrap');
      let cleanup3dMain = null;
      if (p.type === 'video') {
        wrap.innerHTML = `<video src="${p.src}" autoplay loop muted playsinline controls preload="none"></video>`;
      } else if (p.type === '3d') {
        wrap.innerHTML = `<div class="vault-3d-container" id="vault-3d-main"></div>`;
        requestAnimationFrame(() => {
          const c = document.getElementById('vault-3d-main');
          if (c && window.init3DViewer) cleanup3dMain = window.init3DViewer(c, p.src);
        });
      } else {
        wrap.innerHTML = `<img src="${p.src}" alt="${p.name}">`;
      }
      /* tag row */
      const tagsHtml = p.tags.map(t => `<span class="proj-meta-tag">${t}</span>`).join('');
      wrap.insertAdjacentHTML('afterend', `<div class="proj-meta" id="proj-meta-tags">${tagsHtml}</div>`);

      /* WIP grid */
      const grid = document.getElementById('wip-grid');
      if (p.wip && p.wip.length > 0) {
        grid.innerHTML = p.wip.map(w => {
          const media = w.src
            ? (w.type === 'video'
                ? `<video class="wip-media" data-src="${w.src}" muted playsinline preload="none"></video>`
                : w.type === '3d'
                  ? `<div class="wip-media wip-3d-thumb"><span style="font-size:9px;letter-spacing:.25em;color:var(--teal)">// 3D</span></div>`
                  : `<img class="wip-media" src="${w.src}" alt="${w.desc}" loading="lazy">`)
            : `<div class="wip-placeholder"><span class="wip-placeholder-code">${w.step} //</span><span class="wip-placeholder-status">PENDING</span></div>`;
          return `<div class="wip-card">${media}<div class="wip-info"><div class="wip-step">${w.step} //</div><div class="wip-desc">${w.desc}</div></div></div>`;
        }).join('');
      } else {
        /* placeholder quando i WIP non sono ancora stati caricati */
        grid.innerHTML = [1,2,3,4].map(n => `
          <div class="wip-card">
            <div class="wip-placeholder">
              <span class="wip-placeholder-code">WIP_0${n} //</span>
              <span class="wip-placeholder-status">— PENDING UPLOAD —</span>
            </div>
            <div class="wip-info">
              <div class="wip-step">WIP_0${n} //</div>
              <div class="wip-desc">PENDING</div>
            </div>
          </div>`).join('');
      }

      /* lazy-load wip videos */
      const wipObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const v = entry.target.querySelector('video[data-src]');
          if (v && !v.src) v.src = v.dataset.src;
          wipObserver.unobserve(entry.target);
        });
      }, { rootMargin: '200px' });
      grid.querySelectorAll('.wip-card').forEach(c => wipObserver.observe(c));

      /* mostra project view */
      document.getElementById('vault-group-view').style.display   = 'none';
      document.getElementById('vault-project-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    /* ── torna al gruppo dal progetto ── */
    function backToGroup() {
      stopProjectMedia();
      /* pulisce meta tags dinamici */
      const mt = document.getElementById('proj-meta-tags');
      if (mt) mt.remove();
      document.getElementById('header-page-title').textContent = '[SCAN\\\\THE_VAULT]';
      document.getElementById('vault-project-view').style.display = 'none';
      openGroup(currentGroup);
    }

    function stopProjectMedia() {
      document.querySelectorAll('#proj-media-wrap video').forEach(v => { v.pause(); v.src = ''; });
      if (cleanup3dMain) { cleanup3dMain(); cleanup3dMain = null; }
    }

    /* ── z-index + lazy-load + hover video per le folder-card del gruppo attivo ── */
    function initCards() {
      const cards = document.querySelectorAll('.group-page.active .folder-card');
      cards.forEach((c, i) => { c.style.zIndex = i + 1; });
      cards.forEach(card => {
        const v = card.querySelector('video.card-bg');
        if (!v) return;
        v.addEventListener('timeupdate', () => { if (v.currentTime >= 5) v.currentTime = 0; });
        card.addEventListener('mouseenter', () => {
          if (!v.src && v.dataset.src) v.src = v.dataset.src;
          v.currentTime = 0; v.play();
        });
        card.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
      });
    }
  </script>
</body>
</html>
