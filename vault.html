<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVL // SCAN\THE_VAULT</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 0% 50%, rgba(140,20,20,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 100% 50%, rgba(0,90,100,0.18) 0%, transparent 55%),
        #080808;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(8,8,8,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .back-link   { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); transition: color 0.2s; }
    .back-link:hover { color: var(--teal); }
    .page-title  { font-family: 'Prototype', var(--font); font-size: 13px; letter-spacing: 0.28em; color: var(--red); }
    .separator   { color: var(--text-dim); }
    .header-right { font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim); }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px 100px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .archive-heading { font-size: 9px; letter-spacing: 0.25em; color: var(--text-dim); margin-bottom: 4px; }
    .archive-count {
      font-family: 'Prototype', var(--font);
      font-size: 38px;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 48px;
      line-height: 1;
    }
    .archive-count span { color: var(--teal); }

    /* ── FOLDER STACK ── */
    .folder-stack { display: flex; flex-direction: column; }

    .folder-item {
      display: flex;
      align-items: stretch;
      height: 180px;
      border-top: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
      position: relative;
      overflow: hidden;
    }
    .folder-item:last-child { border-bottom: 1px solid var(--border); }
    .folder-item:hover { transform: translateX(52px); }

    /* left tab */
    .folder-tab {
      width: 52px;
      flex-shrink: 0;
      background: #0c0c0c;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.25s, border-color 0.25s;
    }
    .folder-item:hover .folder-tab { background: rgba(0,90,100,0.25); border-right-color: var(--teal-dim); }

    .folder-tab-code {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      font-size: 7px;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      transition: color 0.25s;
    }
    .folder-item:hover .folder-tab-code { color: var(--teal); }

    .folder-tab-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.25s, box-shadow 0.25s;
    }
    .folder-item:hover .folder-tab-dot { background: var(--teal); box-shadow: 0 0 8px var(--teal); }

    /* folder body */
    .folder-body {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 24px 36px;
      gap: 40px;
    }

    .folder-meta { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; }

    .folder-code { font-size: 8px; letter-spacing: 0.28em; color: var(--teal); }

    .folder-name {
      font-family: 'Prototype', var(--font);
      font-size: 28px;
      letter-spacing: 0.06em;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1.1;
      transition: color 0.25s;
    }
    .folder-item:hover .folder-name { color: #fff; }

    .folder-tags { display: flex; gap: 10px; }
    .folder-tag {
      font-size: 7px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 2px 8px;
    }

    /* video/image thumb */
    .folder-thumb {
      width: 220px;
      height: 130px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      background: #0d0d0d;
    }
    .folder-thumb video,
    .folder-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.5) brightness(0.7);
      transition: filter 0.35s;
    }
    .folder-item:hover .folder-thumb video,
    .folder-item:hover .folder-thumb img { filter: saturate(0.9) brightness(0.9); }

    /* play icon overlay */
    .thumb-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
      transition: color 0.25s;
    }
    .folder-item:hover .thumb-play { color: rgba(255,255,255,0.8); }

    /* arrow */
    .folder-arrow {
      display: flex;
      align-items: center;
      padding-right: 24px;
      font-size: 18px;
      color: var(--text-dim);
      transition: color 0.25s, transform 0.35s;
    }
    .folder-item:hover .folder-arrow { color: var(--teal); transform: translateX(6px); }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      position: relative;
      width: 90vw;
      max-width: 1000px;
    }
    .modal video { width: 100%; display: block; }
    .modal-close {
      position: absolute;
      top: -36px;
      right: 0;
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.2s;
    }
    .modal-close:hover { color: var(--red); }
    .modal-title {
      margin-top: 14px;
      font-family: 'Prototype', var(--font);
      font-size: 13px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link">← [HOME]</a>
      <span class="separator">//</span>
      <span class="page-title">[SCAN\\THE_VAULT]</span>
    </div>
    <div class="header-right" id="version-tag">[Version\1.0.0]</div>
  </header>

  <main>
    <div class="section-label">// COMPLETED WORKS — FINAL ARCHIVE</div>

    <div class="archive-heading">ARCHIVE_LOG //</div>
    <div class="archive-count">GRID_DAILY <span>_01</span></div>

    <div class="folder-stack">

      <!-- PROJECT: OAKLEY -->
      <div class="folder-item" onclick="openModal('oakley')">
        <div class="folder-tab">
          <span class="folder-tab-code">CODE_001</span>
          <div class="folder-tab-dot"></div>
        </div>
        <div class="folder-body">
          <div class="folder-meta">
            <div class="folder-code">CODE_001 // 2026</div>
            <div class="folder-name">OAKLEY</div>
            <div class="folder-tags">
              <span class="folder-tag">3D</span>
              <span class="folder-tag">SPOT</span>
              <span class="folder-tag">VIDEO</span>
            </div>
          </div>
          <div class="folder-thumb">
            <video src="projects/vault/oakley/video.mp4" muted preload="metadata"></video>
            <div class="thumb-play">▶ PLAY</div>
          </div>
        </div>
        <div class="folder-arrow">→</div>
      </div>

    </div>
  </main>

  <!-- VIDEO MODAL -->
  <div class="modal-overlay" id="modal-oakley">
    <div class="modal">
      <div class="modal-close" onclick="closeModal('oakley')">[✕ CLOSE]</div>
      <video src="projects/vault/oakley/video.mp4" controls autoplay></video>
      <div class="modal-title">CODE_001 // OAKLEY — SPOT PROMOZIONALE</div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    function openModal(id) {
      const overlay = document.getElementById('modal-' + id);
      overlay.classList.add('active');
      overlay.querySelector('video').play();
    }
    function closeModal(id) {
      const overlay = document.getElementById('modal-' + id);
      overlay.classList.remove('active');
      overlay.querySelector('video').pause();
    }
    document.querySelectorAll('.modal-overlay').forEach(o => {
      o.addEventListener('click', e => { if (e.target === o) closeModal(o.id.replace('modal-',''))});
    });

    /* thumbnail frame at 1s */
    document.querySelectorAll('.folder-thumb video').forEach(v => {
      v.addEventListener('loadedmetadata', () => { v.currentTime = 1; });
    });
  </script>
</body>
</html>
