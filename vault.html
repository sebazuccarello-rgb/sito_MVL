<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVL // SCAN\THE_VAULT</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 0% 50%, rgba(140,20,20,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 100% 50%, rgba(0,90,100,0.18) 0%, transparent 55%),
        #080808;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(8,8,8,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .back-link   { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); transition: color 0.2s; }
    .back-link:hover { color: var(--teal); }
    .page-title  { font-size: 11px; letter-spacing: 0.28em; color: var(--red); }
    .separator   { color: var(--text-dim); }
    .header-right { font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim); }

    /* ── MAIN ── */
    main {
      padding: 60px 0 100px;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 40px;
      padding-right: 40px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── ARCHIVE TITLE ── */
    .archive-heading {
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .archive-count {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 48px;
      line-height: 1;
    }
    .archive-count span { color: var(--teal); }

    /* ── FOLDER STACK ── */
    .folder-stack {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .folder-item {
      display: flex;
      align-items: stretch;
      height: 160px;
      border-top: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  border-color 0.25s;
      position: relative;
      overflow: hidden;
    }
    .folder-item:last-child { border-bottom: 1px solid var(--border); }

    .folder-item:hover {
      transform: translateX(52px);
      border-color: var(--teal-dim);
    }

    /* left tab */
    .folder-tab {
      width: 48px;
      flex-shrink: 0;
      background: #0e0e0e;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.25s;
    }
    .folder-item:hover .folder-tab {
      background: rgba(0, 90, 100, 0.25);
      border-right-color: var(--teal-dim);
    }
    .folder-tab-code {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      font-size: 7px;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      transition: color 0.25s;
    }
    .folder-item:hover .folder-tab-code { color: var(--teal); }
    .folder-tab-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.25s, box-shadow 0.25s;
    }
    .folder-item:hover .folder-tab-dot {
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
    }

    /* folder body */
    .folder-body {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 24px 32px;
      gap: 32px;
      background: transparent;
      transition: background 0.25s;
    }
    .folder-item:hover .folder-body { background: rgba(255,255,255,0.015); }

    .folder-meta {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }
    .folder-code {
      font-size: 8px;
      letter-spacing: 0.28em;
      color: var(--teal);
    }
    .folder-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1.1;
      transition: color 0.25s;
    }
    .folder-item:hover .folder-name { color: #fff; }
    .folder-tags {
      display: flex;
      gap: 10px;
    }
    .folder-tag {
      font-size: 7px;
      letter-spacing: 0.2em;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 2px 7px;
    }

    /* thumbnail */
    .folder-thumb {
      width: 180px;
      height: 110px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .folder-thumb img,
    .folder-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(0.5) brightness(0.7);
      transition: filter 0.35s;
    }
    .folder-item:hover .folder-thumb img,
    .folder-item:hover .folder-thumb video {
      filter: saturate(0.85) brightness(0.9);
    }
    .folder-thumb-empty {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-size: 8px;
      letter-spacing: 0.2em;
      color: #222;
    }

    /* arrow indicator */
    .folder-arrow {
      display: flex;
      align-items: center;
      padding: 0 24px 0 0;
      font-size: 14px;
      color: var(--text-dim);
      transition: color 0.25s, transform 0.35s;
    }
    .folder-item:hover .folder-arrow {
      color: var(--teal);
      transform: translateX(6px);
    }

    /* ── EMPTY STATE ── */
    .empty-vault {
      padding: 80px 0;
      text-align: center;
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.22em;
      line-height: 2.6;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .empty-vault span {
      display: block;
      font-size: 8px;
      color: #282828;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link nav-link">← [HOME]</a>
      <span class="separator">//</span>
      <span class="page-title">[SCAN\\THE_VAULT]</span>
    </div>
    <div class="header-right" id="version-tag">[Version\1.0.0]</div>
  </header>

  <main>
    <div class="section-label">// COMPLETED WORKS — FINAL ARCHIVE</div>

    <div class="archive-heading">ARCHIVE_LOG //</div>
    <div class="archive-count">GRID_DAILY <span>_00</span></div>

    <div class="folder-stack" id="folder-stack">
      <!-- Populated dynamically. Placeholder below. -->
      <div class="empty-vault">
        [ VAULT EMPTY ]<br>
        NO FINAL RENDERS ARCHIVED YET
        <span>// Files must be named: Nome_Cognome_Final_render_nomeprogetto</span>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    /* Example of how to add a folder entry dynamically.
       Replace this with real project data loaded from a JSON manifest. */
    const PROJECTS = [
      /* {
        code: "CODE_001",
        name: "FALLING",
        tags: ["3D", "RENDER", "2026"],
        thumb: "projects/vault/falling/thumb.jpg"
      } */
    ];

    const stack = document.getElementById('folder-stack');
    if (PROJECTS.length > 0) {
      stack.innerHTML = '';
      const count = document.querySelector('.archive-count span');
      if (count) count.textContent = `_${String(PROJECTS.length).padStart(2,'0')}`;

      PROJECTS.forEach((p, i) => {
        const item = document.createElement('div');
        item.className = 'folder-item';
        item.innerHTML = `
          <div class="folder-tab">
            <span class="folder-tab-code">${p.code}</span>
            <div class="folder-tab-dot"></div>
          </div>
          <div class="folder-body">
            <div class="folder-meta">
              <div class="folder-code">${p.code} //</div>
              <div class="folder-name">${p.name}</div>
              <div class="folder-tags">
                ${p.tags.map(t => `<span class="folder-tag">${t}</span>`).join('')}
              </div>
            </div>
            <div class="folder-thumb">
              ${p.thumb
                ? `<img src="${p.thumb}" alt="${p.name}">`
                : `<div class="folder-thumb-empty">[ NO PREVIEW ]</div>`}
            </div>
          </div>
          <div class="folder-arrow">→</div>`;
        stack.appendChild(item);
      });
    }
  </script>
</body>
</html>
