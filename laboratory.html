<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MVL // BASE\LABORATORY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Gradient positions — registered for smooth CSS animation ── */
    @property --g1x { syntax: '<percentage>'; inherits: false; initial-value:  20%; }
    @property --g1y { syntax: '<percentage>'; inherits: false; initial-value:   0%; }
    @property --g2x { syntax: '<percentage>'; inherits: false; initial-value:  80%; }
    @property --g2y { syntax: '<percentage>'; inherits: false; initial-value: 100%; }

    @keyframes bg-drift {
      0%   { --g1x: 20%; --g1y: 100%; --g2x: 80%; --g2y:   0%; }
      25%  { --g1x: 78%; --g1y:  72%; --g2x: 12%; --g2y:  38%; }
      50%  { --g1x: 38%; --g1y:  18%; --g2x: 68%; --g2y:  82%; }
      75%  { --g1x:  6%; --g1y:  48%; --g2x: 92%; --g2y:  58%; }
      100% { --g1x: 20%; --g1y: 100%; --g2x: 80%; --g2y:   0%; }
    }

    html {
      min-height: 100%;
    }
    body {
      min-height: 100vh;
      background-color: #080808;
      background-image:
        radial-gradient(ellipse at var(--g1x) var(--g1y), rgba(0,90,100,0.30) 0%, transparent 58%),
        radial-gradient(ellipse at var(--g2x) var(--g2y), rgba(140,20,20,0.24) 0%, transparent 54%);
      background-attachment: fixed;
      animation: bg-drift 18s ease-in-out infinite;
      overflow-x: hidden;
    }

    #dust-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(8,8,8,0.88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .back-link { font-size: 13px; letter-spacing: 0.18em; color: var(--text-dim); transition: color 0.2s; }
    .back-link:hover { color: var(--teal); }
    .page-title { font-family: 'Prototype', var(--font); font-size: 13px; letter-spacing: 0.28em; color: var(--teal); }
    .separator { color: var(--text-dim); }
    .header-right { font-size: 13px; letter-spacing: 0.14em; color: var(--text-dim); }

    main {
      position: relative;
      z-index: 2;
      padding: 40px 40px 100px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #fff;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── FILM GRAB GRID ── */
    .film-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 80px;
      grid-auto-flow: dense;
      gap: 6px;
    }

    /* ── CARD ── */
    .fc {
      position: relative;
      background: #060606;
      border: 7px solid #000;
      box-shadow: 1px 2px 10px rgba(0,0,0,0.7);
      overflow: hidden;
      cursor: pointer;
      transform-origin: center;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94);
      /* default size for cards beyond 20 */
      grid-column: span 3;
      grid-row: span 2;
    }
    .fc:hover {
      transform: scale(1.06);
      border-color: #333;
      box-shadow: 0 6px 32px rgba(0,0,0,0.95);
      z-index: 20;
    }

    /* ── GLITCH CLICK ── */
    @keyframes fc-glitch {
      0%   { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      10%  { transform: scale(1.06) translate(-5px,2px);  clip-path: inset(6% 0 90% 0);  filter: brightness(3) saturate(0); }
      20%  { transform: scale(1.06) translate(5px,-2px);  clip-path: none;               filter: brightness(0.3); }
      30%  { transform: scale(1.06) translate(-4px,3px);  clip-path: inset(52% 0 32% 0); filter: brightness(2.5) hue-rotate(80deg); }
      40%  { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      50%  { transform: scale(1.06) translate(4px,-1px);  clip-path: inset(72% 0 8% 0);  filter: brightness(1.8) saturate(0); }
      60%  { transform: scale(1.06) translate(-3px,0);   clip-path: none;               filter: brightness(0.5); }
      70%  { transform: scale(1.06) translate(3px,3px);   clip-path: inset(18% 0 72% 0); filter: brightness(2); }
      80%  { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      100% { transform: scale(1);    translate(0,0);     clip-path: none;               filter: brightness(1); }
    }
    .fc.glitching {
      animation: fc-glitch 0.42s steps(1) forwards !important;
      transition: none !important;
      z-index: 50;
      pointer-events: none;
    }

    /* ── LIGHTBOX ── */
    .lb-overlay {
      position: fixed;
      inset: 0;
      z-index: 800;
      background: rgba(0,0,0,0);         /* parte trasparente, JS lo scurisce */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lb-overlay.lb-closing {
      animation: lb-fade-out 0.28s ease forwards;
      pointer-events: none;
    }
    @keyframes lb-fade-out { to { opacity: 0; } }

    .lb-inner {
      position: relative;
      cursor: default;
      will-change: transform, opacity;    /* ottimizza GPU */
    }
    .lb-inner img,
    .lb-inner video {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      display: block;
    }
    .lb-placeholder {
      width: 80vw; height: 60vh;
      background: #080808;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; letter-spacing: 0.3em; color: #1e1e1e;
    }
    .lb-close {
      position: absolute;
      top: -26px; right: 0;
      font-family: var(--font);
      font-size: 9px; letter-spacing: 0.22em;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.2s;
    }
    .lb-close:hover { color: var(--red); }
    .lb-meta {
      margin-top: 10px;
      display: flex; gap: 16px; align-items: baseline;
    }
    .lb-code { font-size: 8px; letter-spacing: 0.25em; color: var(--teal); }
    .lb-name { font-family: 'Prototype', var(--font); font-size: 11px; letter-spacing: 0.14em; color: var(--text); }

    .card-placeholder {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #1a1a1a;
      font-size: 8px;
      letter-spacing: 0.2em;
    }

    .card-media {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.4) brightness(0.6);
      transition: filter 0.35s;
    }
    .fc:hover .card-media { filter: saturate(0.8) brightness(0.82); }

    .card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      z-index: 2;
    }
    .card-code { font-size: 6px; letter-spacing: 0.25em; color: var(--teal); margin-bottom: 2px; }
    .card-name {
      font-family: 'Prototype', var(--font);
      font-size: 10px; letter-spacing: 0.1em;
      color: var(--text); text-transform: uppercase;
    }
    .card-status { margin-top: 3px; display: flex; align-items: center; gap: 5px; }
    .status-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 4px var(--red);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-text { font-size: 6px; letter-spacing: 0.2em; color: var(--text-dim); }

    /* ── EMPTY STATE ── */
    .empty-state {
      display: none;
      position: absolute;
      top: 50vh;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }
    .empty-state.visible { display: block; }

    .empty-label {
      font-size: 8px;
      letter-spacing: 0.32em;
      color: var(--text-dim);
      margin-bottom: 18px;
    }
    .empty-title {
      font-family: 'Prototype', var(--font);
      font-size: 28px;
      letter-spacing: 0.22em;
      color: var(--text);
      line-height: 1.3;
      text-transform: uppercase;
      animation: fluorescent 4.5s steps(1) infinite;
    }
    .empty-sub {
      margin-top: 20px;
      font-size: 7px;
      letter-spacing: 0.28em;
      color: var(--text-dim);
      animation: fluorescent 4.5s steps(1) infinite;
      animation-delay: 0.08s;
    }

    /* flickering luce fluorescente */
    @keyframes fluorescent {
      0%,   3.9%  { opacity: 1;    }
      4%,   4.4%  { opacity: 0;    }   /* scatto 1 */
      4.5%, 5.9%  { opacity: 1;    }
      6%,   6.2%  { opacity: 0.15; }   /* tremolìo */
      6.3%, 27.9% { opacity: 1;    }
      28%,  28.4% { opacity: 0;    }   /* doppio scatto */
      28.5%,28.9% { opacity: 1;    }
      29%,  29.4% { opacity: 0;    }
      29.5%,54.9% { opacity: 1;    }
      55%,  56.9% { opacity: 0;    }   /* spegnimento lungo */
      57%,  57.4% { opacity: 0.6;  }   /* riaccensione instabile */
      57.5%,57.9% { opacity: 0;    }
      58%,  81.9% { opacity: 1;    }
      82%,  82.2% { opacity: 0;    }   /* micro-scatto finale */
      82.3%,100%  { opacity: 1;    }
    }

    /* ── GRID PLACEMENT — le regole nth-child vengono generate dinamicamente via JS
       in base al numero di card nell'array CARDS ── */

    /* ── TABLET (769–1100px) ── */
    @media (max-width: 1100px) {
      main { padding: 32px 24px 100px; }
      .film-grid { grid-template-columns: repeat(8, 1fr); }
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      header { padding: 12px 16px; }
      main { padding: 20px 12px 80px; }

      /* Disabilita background-attachment: fixed su mobile (bug iOS Safari) */
      body { background-attachment: scroll; }

      .film-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 44vw;
      }
      .fc {
        grid-column: span 1 !important;
        grid-row: span 1 !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body { animation: none; }
    }
  </style>
</head>
<body>

  <canvas id="dust-canvas"></canvas>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link nav-link"><img src="assets/1x/Risorsa 5.png" alt="MVL" class="header-logo"></a>
      <span class="separator">//</span>
      <span class="page-title">[BASE\\LABORATORY]</span>
    </div>
    <div class="header-right" id="version-tag">[Version\1.0.0]</div>
  </header>

  <main>
    <div class="page-top-label">
      <div>
        <div class="page-archive-title">WORK_IN_PROGRESS //</div>
        <div class="page-main-title">THE_LABORATORY</div>
      </div>
    </div>
    <div class="film-grid" id="film-grid"></div>
    <div class="empty-state" id="empty-state">
      <div class="empty-label">// LAB STATUS //</div>
      <div class="empty-title">NO EXPERIMENTS<br>IN PROGRESS</div>
      <div class="empty-sub">[ AWAITING INPUT ]</div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/dust.js"></script>
  <script>
    /* ══════════════════════════════════════════════════════
       CARDS — aggiungere una voce per ogni file.
       Denominazione file: WIP_NNN_NOME_PROGETTO.mp4 / .jpg / .png
       Esempio:
         { code:'WIP_001', name:'NOME_PROGETTO', src:'projects/laboratory/WIP_001_NOME_PROGETTO.mp4', type:'video' },
         { code:'WIP_002', name:'NOME_PROGETTO', src:'projects/laboratory/WIP_002_NOME_PROGETTO.jpg', type:'img'   },
    ══════════════════════════════════════════════════════ */
    const CARDS = [
      /* — inserire qui — */
    ];

    /* ── Layout mosaic: pattern di 40 posizioni, si ripete ogni 27 righe ── */
    const TILE_ROWS = 27;
    const MOSAIC = [
      /* Blocco A — 7 card, righe 1-4 */
      {c:'1/5',   r:'1/5' }, {c:'5/7',   r:'1/3' }, {c:'7/9',   r:'1/3' },
      {c:'9/13',  r:'1/3' }, {c:'5/7',   r:'3/5' }, {c:'7/11',  r:'3/5' },
      {c:'11/13', r:'3/5' },
      /* Blocco B — 7 card, righe 5-8 */
      {c:'1/3',   r:'5/9' }, {c:'3/6',   r:'5/7' }, {c:'6/10',  r:'5/7' },
      {c:'10/13', r:'5/7' }, {c:'3/7',   r:'7/9' }, {c:'7/10',  r:'7/9' },
      {c:'10/13', r:'7/9' },
      /* Blocco C — 6 card, righe 9-13 */
      {c:'1/5',   r:'9/12'  }, {c:'5/8',   r:'9/11'  }, {c:'8/13',  r:'9/12'  },
      {c:'5/8',   r:'11/14' }, {c:'1/5',   r:'12/14' }, {c:'8/13',  r:'12/14' },
      /* Blocco D — 6 card, righe 14-17 */
      {c:'1/4',   r:'14/16' }, {c:'4/9',   r:'14/18' }, {c:'9/13',  r:'14/16' },
      {c:'1/4',   r:'16/18' }, {c:'9/11',  r:'16/18' }, {c:'11/13', r:'16/18' },
      /* Blocco E — 5 card, righe 18-21 */
      {c:'1/5',   r:'18/22' }, {c:'5/8',   r:'18/20' }, {c:'8/13',  r:'18/20' },
      {c:'5/10',  r:'20/22' }, {c:'10/13', r:'20/22' },
      /* Blocco F — 9 card, righe 22-27 */
      {c:'1/3',   r:'22/26' }, {c:'3/7',   r:'22/24' }, {c:'7/11',  r:'22/24' },
      {c:'11/13', r:'22/26' }, {c:'3/6',   r:'24/26' }, {c:'6/11',  r:'24/26' },
      {c:'1/7',   r:'26/28' }, {c:'7/10',  r:'26/28' }, {c:'10/13', r:'26/28' },
    ];

    /* applica posizione: tila il pattern ogni TILE_ROWS righe */
    function applyLayout(card, idx) {
      const m      = MOSAIC[idx % MOSAIC.length];
      const offset = Math.floor(idx / MOSAIC.length) * TILE_ROWS;
      const [rs, re] = m.r.split('/').map(Number);
      card.style.gridColumn = m.c;
      card.style.gridRow    = `${rs + offset} / ${re + offset}`;
    }

    const grid = document.getElementById('film-grid');
    CARDS.forEach((d, i) => {
      const card = document.createElement('div');
      card.className = 'fc';
      const media = d.type === 'video'
        ? `<video class="card-media" src="${d.src}" muted playsinline preload="metadata"></video>`
        : `<img class="card-media" src="${d.src}" alt="${d.name}">`;
      card.innerHTML = `
        ${media}
        <div class="card-info">
          <div class="card-code">${d.code} //</div>
          <div class="card-name">${d.name}</div>
          <div class="card-status"><div class="status-dot"></div><span class="status-text">ACTIVE</span></div>
        </div>`;
      applyLayout(card, i);
      grid.appendChild(card);
    });

    /* empty state */
    if (CARDS.length === 0) document.getElementById('empty-state').classList.add('visible');

    /* hover preview per i video */
    grid.querySelectorAll('.fc').forEach(card => {
      const v = card.querySelector('video.card-media');
      if (!v) return;
      card.addEventListener('mouseenter', () => { v.currentTime = 0; v.play(); });
      card.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
    });

    /* ── click: glitch → lightbox ── */
    grid.addEventListener('click', e => {
      const card = e.target.closest('.fc');
      if (!card || card.classList.contains('glitching')) return;
      card.classList.add('glitching');
      setTimeout(() => {
        card.classList.remove('glitching');
        openLightbox(card);
      }, 420);
    });

    function openLightbox(card) {
      const cRect  = card.getBoundingClientRect();          // posizione esatta card
      const media  = card.querySelector('.card-media');
      const code   = card.querySelector('.card-code')?.textContent || '';
      const name   = card.querySelector('.card-name')?.textContent || '';

      let mediaHTML;
      if (media) {
        mediaHTML = media.tagName === 'VIDEO'
          ? `<video src="${media.src}" autoplay loop muted playsinline></video>`
          : `<img src="${media.src}" alt="${name}">`;
      } else {
        mediaHTML = `<div class="lb-placeholder">[ NO SIGNAL ]</div>`;
      }

      const overlay = document.createElement('div');
      overlay.className = 'lb-overlay';
      overlay.innerHTML = `
        <div class="lb-inner">
          <div class="lb-close">[✕ CLOSE]</div>
          ${mediaHTML}
          <div class="lb-meta">
            <span class="lb-code">${code}</span>
            <span class="lb-name">${name}</span>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      /* ── FLIP: misuro la posizione finale, poi parto da quella della card ── */
      const inner  = overlay.querySelector('.lb-inner');
      const iRect  = inner.getBoundingClientRect();         // posizione finale centrata

      /* differenza di centri tra card e inner */
      const dx     = (cRect.left + cRect.width  / 2) - (iRect.left + iRect.width  / 2);
      const dy     = (cRect.top  + cRect.height / 2) - (iRect.top  + iRect.height / 2);
      /* scala: quanto è piccola la card rispetto all'inner */
      const scale  = Math.min(cRect.width / iRect.width, cRect.height / iRect.height);

      /* stato iniziale: posizionato e scalato come la card */
      inner.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      inner.style.opacity   = '0';
      inner.style.transition = 'none';

      /* due rAF: assicuro che il browser abbia dipinto lo stato iniziale */
      requestAnimationFrame(() => requestAnimationFrame(() => {
        /* sfondo: fade in */
        overlay.style.transition = 'background 0.55s ease';
        overlay.style.background = 'rgba(0,0,0,0.97)';
        /* inner: zoom dal punto della card al centro — spring curve, 0.82s */
        inner.style.transition = 'transform 0.82s cubic-bezier(0.16,1,0.3,1), opacity 0.28s ease';
        inner.style.transform  = 'translate(0,0) scale(1)';
        inner.style.opacity    = '1';
      }));

      /* ── chiusura ── */
      const close = () => {
        overlay.classList.add('lb-closing');
        setTimeout(() => overlay.remove(), 280);
        document.removeEventListener('keydown', onKey);
      };
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
      inner.querySelector('.lb-close').addEventListener('click', close);
      const onKey = e => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
    }
  </script>
</body>
</html>
