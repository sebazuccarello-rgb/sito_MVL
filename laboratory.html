<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVL // BASE\LABORATORY</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Gradient positions — registered for smooth CSS animation ── */
    @property --g1x { syntax: '<percentage>'; inherits: false; initial-value:  20%; }
    @property --g1y { syntax: '<percentage>'; inherits: false; initial-value:   0%; }
    @property --g2x { syntax: '<percentage>'; inherits: false; initial-value:  80%; }
    @property --g2y { syntax: '<percentage>'; inherits: false; initial-value: 100%; }

    @keyframes bg-drift {
      0%   { --g1x: 20%; --g1y:   0%; --g2x: 80%; --g2y: 100%; }
      25%  { --g1x: 78%; --g1y:  28%; --g2x: 12%; --g2y:  62%; }
      50%  { --g1x: 38%; --g1y:  82%; --g2x: 68%; --g2y:  18%; }
      75%  { --g1x:  6%; --g1y:  52%; --g2x: 92%; --g2y:  42%; }
      100% { --g1x: 20%; --g1y:   0%; --g2x: 80%; --g2y: 100%; }
    }

    body {
      min-height: 100vh;
      background-color: #080808;
      background-image:
        radial-gradient(ellipse at var(--g1x) var(--g1y), rgba(0,90,100,0.30) 0%, transparent 58%),
        radial-gradient(ellipse at var(--g2x) var(--g2y), rgba(140,20,20,0.24) 0%, transparent 54%);
      background-size: 100% 100%;
      background-attachment: fixed;   /* rimane ancorato al viewport — lunghezza pagina irrilevante */
      animation: bg-drift 18s ease-in-out infinite;
      overflow-x: hidden;
    }

    #dust-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(8,8,8,0.88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .back-link { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); transition: color 0.2s; }
    .back-link:hover { color: var(--teal); }
    .page-title { font-family: 'Prototype', var(--font); font-size: 13px; letter-spacing: 0.28em; color: var(--teal); }
    .separator { color: var(--text-dim); }
    .header-right { font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim); }

    main {
      position: relative;
      z-index: 2;
      padding: 40px 40px 100px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── FILM GRAB GRID ── */
    .film-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 80px;
      grid-auto-flow: dense;
      gap: 6px;
    }

    /* ── CARD ── */
    .fc {
      position: relative;
      background: #060606;
      border: 7px solid #000;
      box-shadow: 1px 2px 10px rgba(0,0,0,0.7);
      overflow: hidden;
      cursor: pointer;
      transform-origin: center;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94);
      /* default size for cards beyond 20 */
      grid-column: span 3;
      grid-row: span 2;
    }
    .fc:hover {
      transform: scale(1.06);
      border-color: #333;
      box-shadow: 0 6px 32px rgba(0,0,0,0.95);
      z-index: 20;
    }

    /* ── GLITCH CLICK ── */
    @keyframes fc-glitch {
      0%   { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      10%  { transform: scale(1.06) translate(-5px,2px);  clip-path: inset(6% 0 90% 0);  filter: brightness(3) saturate(0); }
      20%  { transform: scale(1.06) translate(5px,-2px);  clip-path: none;               filter: brightness(0.3); }
      30%  { transform: scale(1.06) translate(-4px,3px);  clip-path: inset(52% 0 32% 0); filter: brightness(2.5) hue-rotate(80deg); }
      40%  { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      50%  { transform: scale(1.06) translate(4px,-1px);  clip-path: inset(72% 0 8% 0);  filter: brightness(1.8) saturate(0); }
      60%  { transform: scale(1.06) translate(-3px,0);   clip-path: none;               filter: brightness(0.5); }
      70%  { transform: scale(1.06) translate(3px,3px);   clip-path: inset(18% 0 72% 0); filter: brightness(2); }
      80%  { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      100% { transform: scale(1);    translate(0,0);     clip-path: none;               filter: brightness(1); }
    }
    .fc.glitching {
      animation: fc-glitch 0.42s steps(1) forwards !important;
      transition: none !important;
      z-index: 50;
      pointer-events: none;
    }

    /* ── LIGHTBOX ── */
    .lb-overlay {
      position: fixed;
      inset: 0;
      z-index: 800;
      background: rgba(0,0,0,0);         /* parte trasparente, JS lo scurisce */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lb-overlay.lb-closing {
      animation: lb-fade-out 0.28s ease forwards;
      pointer-events: none;
    }
    @keyframes lb-fade-out { to { opacity: 0; } }

    .lb-inner {
      position: relative;
      cursor: default;
      will-change: transform, opacity;    /* ottimizza GPU */
    }
    .lb-inner img,
    .lb-inner video {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      display: block;
    }
    .lb-placeholder {
      width: 80vw; height: 60vh;
      background: #080808;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; letter-spacing: 0.3em; color: #1e1e1e;
    }
    .lb-close {
      position: absolute;
      top: -26px; right: 0;
      font-family: var(--font);
      font-size: 9px; letter-spacing: 0.22em;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.2s;
    }
    .lb-close:hover { color: var(--red); }
    .lb-meta {
      margin-top: 10px;
      display: flex; gap: 16px; align-items: baseline;
    }
    .lb-code { font-size: 8px; letter-spacing: 0.25em; color: var(--teal); }
    .lb-name { font-family: 'Prototype', var(--font); font-size: 11px; letter-spacing: 0.14em; color: var(--text); }

    .card-placeholder {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #1a1a1a;
      font-size: 8px;
      letter-spacing: 0.2em;
    }

    .card-media {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.4) brightness(0.6);
      transition: filter 0.35s;
    }
    .fc:hover .card-media { filter: saturate(0.8) brightness(0.82); }

    .card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      z-index: 2;
    }
    .card-code { font-size: 6px; letter-spacing: 0.25em; color: var(--teal); margin-bottom: 2px; }
    .card-name {
      font-family: 'Prototype', var(--font);
      font-size: 10px; letter-spacing: 0.1em;
      color: var(--text); text-transform: uppercase;
    }
    .card-status { margin-top: 3px; display: flex; align-items: center; gap: 5px; }
    .status-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 4px var(--red);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-text { font-size: 6px; letter-spacing: 0.2em; color: var(--text-dim); }

    /* ── GRID PLACEMENT — mosaic esatto, zero buchi ── */
    /* Blocco A — righe 1-4 */
    .fc:nth-child(1)  { grid-column: 1 / 5;   grid-row: 1 / 5;  }  /* 4×4 grande */
    .fc:nth-child(2)  { grid-column: 5 / 7;   grid-row: 1 / 3;  }  /* 2×2 */
    .fc:nth-child(3)  { grid-column: 7 / 9;   grid-row: 1 / 3;  }  /* 2×2 */
    .fc:nth-child(4)  { grid-column: 9 / 13;  grid-row: 1 / 3;  }  /* 4×2 largo */
    .fc:nth-child(5)  { grid-column: 5 / 7;   grid-row: 3 / 5;  }  /* 2×2 */
    .fc:nth-child(6)  { grid-column: 7 / 11;  grid-row: 3 / 5;  }  /* 4×2 largo */
    .fc:nth-child(7)  { grid-column: 11 / 13; grid-row: 3 / 5;  }  /* 2×2 */
    /* Blocco B — righe 5-8 */
    .fc:nth-child(8)  { grid-column: 1 / 3;   grid-row: 5 / 9;  }  /* 2×4 alto */
    .fc:nth-child(9)  { grid-column: 3 / 6;   grid-row: 5 / 7;  }  /* 3×2 */
    .fc:nth-child(10) { grid-column: 6 / 10;  grid-row: 5 / 7;  }  /* 4×2 largo */
    .fc:nth-child(11) { grid-column: 10 / 13; grid-row: 5 / 7;  }  /* 3×2 */
    .fc:nth-child(12) { grid-column: 3 / 7;   grid-row: 7 / 9;  }  /* 4×2 largo */
    .fc:nth-child(13) { grid-column: 7 / 10;  grid-row: 7 / 9;  }  /* 3×2 */
    .fc:nth-child(14) { grid-column: 10 / 13; grid-row: 7 / 9;  }  /* 3×2 */
    /* Blocco C — righe 9-13 */
    .fc:nth-child(15) { grid-column: 1 / 5;   grid-row: 9 / 12; }  /* 4×3 alto */
    .fc:nth-child(16) { grid-column: 5 / 8;   grid-row: 9 / 11; }  /* 3×2 */
    .fc:nth-child(17) { grid-column: 8 / 13;  grid-row: 9 / 12; }  /* 5×3 grande */
    .fc:nth-child(18) { grid-column: 5 / 8;   grid-row: 11 / 14;}  /* 3×3 alto */
    .fc:nth-child(19) { grid-column: 1 / 5;   grid-row: 12 / 14;}  /* 4×2 */
    .fc:nth-child(20) { grid-column: 8 / 13;  grid-row: 12 / 14;}  /* 5×2 largo */
  </style>
</head>
<body>

  <canvas id="dust-canvas"></canvas>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link nav-link">← [HOME]</a>
      <span class="separator">//</span>
      <span class="page-title">[BASE\\LABORATORY]</span>
    </div>
    <div class="header-right" id="version-tag">[Version\1.0.0]</div>
  </header>

  <main>
    <div class="section-label">// WORK IN PROGRESS — ACTIVE EXPERIMENTS</div>
    <div class="film-grid" id="film-grid"></div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/dust.js"></script>
  <script>
    /* ── generate cards ── */
    const grid = document.getElementById('film-grid');
    for (let i = 1; i <= 20; i++) {
      const num  = String(i).padStart(3, '0');
      const card = document.createElement('div');
      card.className = 'fc';
      card.innerHTML = `
        <div class="card-placeholder">[ NO SIGNAL ]</div>
        <div class="card-info">
          <div class="card-code">WIP_${num} //</div>
          <div class="card-name">AWAITING_INPUT</div>
          <div class="card-status"><div class="status-dot"></div><span class="status-text">DORMANT</span></div>
        </div>`;
      grid.appendChild(card);
    }

    /* ── click: glitch → lightbox ── */
    grid.addEventListener('click', e => {
      const card = e.target.closest('.fc');
      if (!card || card.classList.contains('glitching')) return;
      card.classList.add('glitching');
      setTimeout(() => {
        card.classList.remove('glitching');
        openLightbox(card);
      }, 420);
    });

    function openLightbox(card) {
      const cRect  = card.getBoundingClientRect();          // posizione esatta card
      const media  = card.querySelector('.card-media');
      const code   = card.querySelector('.card-code')?.textContent || '';
      const name   = card.querySelector('.card-name')?.textContent || '';

      let mediaHTML;
      if (media) {
        mediaHTML = media.tagName === 'VIDEO'
          ? `<video src="${media.src}" autoplay loop muted playsinline></video>`
          : `<img src="${media.src}" alt="${name}">`;
      } else {
        mediaHTML = `<div class="lb-placeholder">[ NO SIGNAL ]</div>`;
      }

      const overlay = document.createElement('div');
      overlay.className = 'lb-overlay';
      overlay.innerHTML = `
        <div class="lb-inner">
          <div class="lb-close">[✕ CLOSE]</div>
          ${mediaHTML}
          <div class="lb-meta">
            <span class="lb-code">${code}</span>
            <span class="lb-name">${name}</span>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      /* ── FLIP: misuro la posizione finale, poi parto da quella della card ── */
      const inner  = overlay.querySelector('.lb-inner');
      const iRect  = inner.getBoundingClientRect();         // posizione finale centrata

      /* differenza di centri tra card e inner */
      const dx     = (cRect.left + cRect.width  / 2) - (iRect.left + iRect.width  / 2);
      const dy     = (cRect.top  + cRect.height / 2) - (iRect.top  + iRect.height / 2);
      /* scala: quanto è piccola la card rispetto all'inner */
      const scale  = Math.min(cRect.width / iRect.width, cRect.height / iRect.height);

      /* stato iniziale: posizionato e scalato come la card */
      inner.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      inner.style.opacity   = '0';
      inner.style.transition = 'none';

      /* due rAF: assicuro che il browser abbia dipinto lo stato iniziale */
      requestAnimationFrame(() => requestAnimationFrame(() => {
        /* sfondo: fade in */
        overlay.style.transition = 'background 0.55s ease';
        overlay.style.background = 'rgba(0,0,0,0.97)';
        /* inner: zoom dal punto della card al centro — spring curve, 0.82s */
        inner.style.transition = 'transform 0.82s cubic-bezier(0.16,1,0.3,1), opacity 0.28s ease';
        inner.style.transform  = 'translate(0,0) scale(1)';
        inner.style.opacity    = '1';
      }));

      /* ── chiusura ── */
      const close = () => {
        overlay.classList.add('lb-closing');
        setTimeout(() => overlay.remove(), 280);
        document.removeEventListener('keydown', onKey);
      };
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
      inner.querySelector('.lb-close').addEventListener('click', close);
      const onKey = e => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
    }
  </script>
</body>
</html>
