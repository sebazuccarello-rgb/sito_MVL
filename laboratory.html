<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MVL // BASE\LABORATORY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <style>
    body { overflow-x: hidden; }
    .mvl-header { background: rgba(8,8,8,0.88); }
    .page-title { font-family: 'Prototype', var(--font); font-size: 13px; letter-spacing: 0.28em; color: var(--teal); }

    main {
      position: relative;
      z-index: 2;
      padding: 40px 40px 100px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #fff;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── FILM GRAB GRID ── */
    .film-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 80px;
      grid-auto-flow: dense;
      gap: 6px;
    }

    /* ── CARD ── */
    .fc {
      position: relative;
      background: #060606;
      border: 7px solid #000;
      box-shadow: 1px 2px 10px rgba(0,0,0,0.7);
      overflow: hidden;
      cursor: pointer;
      transform-origin: center;
      transition: border-color 0.25s, box-shadow 0.25s, transform 0.32s cubic-bezier(0.25,0.46,0.45,0.94);
      /* default size for cards beyond 20 */
      grid-column: span 3;
      grid-row: span 2;
    }
    .fc:hover {
      transform: scale(1.06);
      border-color: #333;
      box-shadow: 0 6px 32px rgba(0,0,0,0.95);
      z-index: 20;
    }

    /* ── GLITCH CLICK ── */
    @keyframes fc-glitch {
      0%   { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      10%  { transform: scale(1.06) translate(-5px,2px);  clip-path: inset(6% 0 90% 0);  filter: brightness(3) saturate(0); }
      20%  { transform: scale(1.06) translate(5px,-2px);  clip-path: none;               filter: brightness(0.3); }
      30%  { transform: scale(1.06) translate(-4px,3px);  clip-path: inset(52% 0 32% 0); filter: brightness(2.5) hue-rotate(80deg); }
      40%  { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      50%  { transform: scale(1.06) translate(4px,-1px);  clip-path: inset(72% 0 8% 0);  filter: brightness(1.8) saturate(0); }
      60%  { transform: scale(1.06) translate(-3px,0);   clip-path: none;               filter: brightness(0.5); }
      70%  { transform: scale(1.06) translate(3px,3px);   clip-path: inset(18% 0 72% 0); filter: brightness(2); }
      80%  { transform: scale(1.06) translate(0,0);     clip-path: none;               filter: brightness(1); }
      100% { transform: scale(1);    translate(0,0);     clip-path: none;               filter: brightness(1); }
    }
    .fc.glitching {
      animation: fc-glitch 0.42s steps(1) forwards !important;
      transition: none !important;
      z-index: 50;
      pointer-events: none;
    }

    /* ── LIGHTBOX ── */
    .lb-overlay {
      position: fixed;
      inset: 0;
      z-index: 800;
      background: rgba(0,0,0,0);         /* parte trasparente, JS lo scurisce */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lb-overlay.lb-closing {
      animation: lb-fade-out 0.28s ease forwards;
      pointer-events: none;
    }
    @keyframes lb-fade-out { to { opacity: 0; } }

    .lb-inner {
      position: relative;
      cursor: default;
      will-change: transform, opacity;    /* ottimizza GPU */
    }
    .lb-inner img,
    .lb-inner video {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      display: block;
    }
    .lb-placeholder {
      width: 80vw; height: 60vh;
      background: #080808;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; letter-spacing: 0.3em; color: #1e1e1e;
    }
    .lb-close {
      position: absolute;
      top: -26px; right: 0;
      font-family: var(--font);
      font-size: 9px; letter-spacing: 0.22em;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.2s;
    }
    .lb-close:hover { color: var(--red); }
    .lb-meta {
      margin-top: 10px;
      display: flex; gap: 16px; align-items: baseline;
    }
    .lb-code { font-size: 8px; letter-spacing: 0.25em; color: var(--teal); }
    .lb-name { font-family: 'Prototype', var(--font); font-size: 11px; letter-spacing: 0.14em; color: var(--text); }
    .lb-hint { font-size: 9px; letter-spacing: 0.18em; color: var(--text-dim); }

    .lb-inner--3d { width: 90vw; max-width: 1100px; }
    .lb-3d-container { width: 100%; height: 70vh; background: #0d0d0d; position: relative; }

    .card-placeholder {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #1a1a1a;
      font-size: 8px;
      letter-spacing: 0.2em;
    }

    .card-media {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.4) brightness(0.6);
      transition: filter 0.35s;
    }
    .fc:hover .card-media { filter: saturate(0.8) brightness(0.82); }

    .card-3d-thumb {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: rgba(0,180,200,0.04);
      border: 1px solid rgba(0,180,200,0.15);
      transition: background 0.35s, border-color 0.35s;
    }
    .fc:hover .card-3d-thumb { background: rgba(0,180,200,0.08); border-color: rgba(0,180,200,0.35); }
    .card-3d-thumb .icon-3d { font-size: 11px; letter-spacing: .28em; color: var(--teal); }
    .card-3d-thumb .label-3d { font-size: 9px; letter-spacing: .22em; color: var(--text-dim); }

    .card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      z-index: 2;
    }
    .card-code { font-size: 6px; letter-spacing: 0.25em; color: var(--teal); margin-bottom: 2px; }
    .card-name {
      font-family: 'Prototype', var(--font);
      font-size: 10px; letter-spacing: 0.1em;
      color: var(--text); text-transform: uppercase;
    }
    .card-status { margin-top: 3px; display: flex; align-items: center; gap: 5px; }
    .status-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 4px var(--red);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-text { font-size: 6px; letter-spacing: 0.2em; color: var(--text-dim); }

    /* ── EMPTY STATE ── */
    .empty-state {
      display: none;
      position: absolute;
      top: 50vh;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }
    .empty-state.visible { display: block; }

    .empty-label {
      font-size: 8px;
      letter-spacing: 0.32em;
      color: var(--text-dim);
      margin-bottom: 18px;
    }
    .empty-title {
      font-family: 'Prototype', var(--font);
      font-size: 28px;
      letter-spacing: 0.22em;
      color: var(--text);
      line-height: 1.3;
      text-transform: uppercase;
      animation: fluorescent 4.5s steps(1) infinite;
    }
    .empty-sub {
      margin-top: 20px;
      font-size: 7px;
      letter-spacing: 0.28em;
      color: var(--text-dim);
      animation: fluorescent 4.5s steps(1) infinite;
      animation-delay: 0.08s;
    }

    /* flickering luce fluorescente */
    @keyframes fluorescent {
      0%,   3.9%  { opacity: 1;    }
      4%,   4.4%  { opacity: 0;    }   /* scatto 1 */
      4.5%, 5.9%  { opacity: 1;    }
      6%,   6.2%  { opacity: 0.15; }   /* tremolìo */
      6.3%, 27.9% { opacity: 1;    }
      28%,  28.4% { opacity: 0;    }   /* doppio scatto */
      28.5%,28.9% { opacity: 1;    }
      29%,  29.4% { opacity: 0;    }
      29.5%,54.9% { opacity: 1;    }
      55%,  56.9% { opacity: 0;    }   /* spegnimento lungo */
      57%,  57.4% { opacity: 0.6;  }   /* riaccensione instabile */
      57.5%,57.9% { opacity: 0;    }
      58%,  81.9% { opacity: 1;    }
      82%,  82.2% { opacity: 0;    }   /* micro-scatto finale */
      82.3%,100%  { opacity: 1;    }
    }

    /* ── GRID PLACEMENT — le regole nth-child vengono generate dinamicamente via JS
       in base al numero di card nell'array CARDS ── */

    /* ── TABLET (769–1100px) ── */
    @media (max-width: 1100px) {
      main { padding: 32px 24px 100px; }
      .film-grid { grid-template-columns: repeat(8, 1fr); }
    }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      main { padding: 20px 12px 80px; }

      .film-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 44vw;
      }
      .fc {
        grid-column: span 1 !important;
        grid-row: span 1 !important;
      }
    }
  </style>
</head>
<body class="mvl-bg-drift">

  <canvas id="dust-canvas"></canvas>

  <header class="mvl-header">
    <div class="header-left">
      <a href="index.html" class="back-link nav-link"><img src="assets/1x/Risorsa 5.png" alt="MVL" class="header-logo"></a>
      <span class="separator">//</span>
      <span class="page-title">[BASE\\LABORATORY]</span>
    </div>
    <div class="header-right">
      <div class="lang-toggle">
        <button data-lang="it" onclick="MVL_I18N.setLang('it')">IT</button>
        <span class="sep">/</span>
        <button data-lang="en" onclick="MVL_I18N.setLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main>
    <div class="page-top-label">
      <div>
        <div class="page-archive-title">WORK_IN_PROGRESS //</div>
        <div class="page-main-title">THE_LABORATORY</div>
      </div>
    </div>
    <div class="film-grid" id="film-grid"></div>
    <div class="empty-state" id="empty-state">
      <div class="empty-label">// LAB STATUS //</div>
      <div class="empty-title">NO EXPERIMENTS<br>IN PROGRESS</div>
      <div class="empty-sub">[ AWAITING INPUT ]</div>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dust.js"></script>
  <script src="js/projects.js"></script>
  <script type="module" src="js/viewer3d.js"></script>
  <script src="js/laboratory.js"></script>
</body>
</html>
