<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVL // BASE\LABORATORY</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 20% 0%,   rgba(0,90,100,0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%,  rgba(140,20,20,0.22) 0%, transparent 55%),
        #080808;
      overflow-x: hidden;
    }

    #dust-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(8,8,8,0.88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .back-link { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); transition: color 0.2s; }
    .back-link:hover { color: var(--teal); }
    .page-title { font-family: 'Prototype', var(--font); font-size: 13px; letter-spacing: 0.28em; color: var(--teal); }
    .separator { color: var(--text-dim); }
    .header-right { font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim); }

    main {
      position: relative;
      z-index: 2;
      padding: 40px 40px 100px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── FILM GRAB GRID ── */
    .film-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 80px;
      gap: 6px;
    }

    /* ── CARD ── */
    .fc {
      position: relative;
      background: #060606;
      border: 7px solid #000;
      box-shadow: 1px 2px 10px rgba(0,0,0,0.7);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .fc:hover {
      border-color: #333;
      box-shadow: 2px 4px 20px rgba(0,0,0,0.9);
      z-index: 10;
    }

    .card-placeholder {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #1a1a1a;
      font-size: 8px;
      letter-spacing: 0.2em;
    }

    .card-media {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.4) brightness(0.6);
      transition: filter 0.35s;
    }
    .fc:hover .card-media { filter: saturate(0.8) brightness(0.82); }

    .card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      z-index: 2;
    }
    .card-code { font-size: 6px; letter-spacing: 0.25em; color: var(--teal); margin-bottom: 2px; }
    .card-name {
      font-family: 'Prototype', var(--font);
      font-size: 10px; letter-spacing: 0.1em;
      color: var(--text); text-transform: uppercase;
    }
    .card-status { margin-top: 3px; display: flex; align-items: center; gap: 5px; }
    .status-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 4px var(--red);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-text { font-size: 6px; letter-spacing: 0.2em; color: var(--text-dim); }

    /* ── GRID SPANS — film grab layout ── */
    /* Row 1 */
    .fc:nth-child(1)  { grid-column: span 4; grid-row: span 4; }
    .fc:nth-child(2)  { grid-column: span 2; grid-row: span 2; }
    .fc:nth-child(3)  { grid-column: span 2; grid-row: span 2; }
    .fc:nth-child(4)  { grid-column: span 4; grid-row: span 2; }
    /* Row 2 cont */
    .fc:nth-child(5)  { grid-column: span 2; grid-row: span 2; }
    .fc:nth-child(6)  { grid-column: span 2; grid-row: span 2; }
    .fc:nth-child(7)  { grid-column: span 4; grid-row: span 3; }
    /* Row 3 */
    .fc:nth-child(8)  { grid-column: span 3; grid-row: span 3; }
    .fc:nth-child(9)  { grid-column: span 2; grid-row: span 2; }
    .fc:nth-child(10) { grid-column: span 3; grid-row: span 2; }
    /* Row 4 */
    .fc:nth-child(11) { grid-column: span 5; grid-row: span 3; }
    .fc:nth-child(12) { grid-column: span 2; grid-row: span 2; }
    .fc:nth-child(13) { grid-column: span 2; grid-row: span 3; }
    .fc:nth-child(14) { grid-column: span 3; grid-row: span 2; }
    /* Row 5 */
    .fc:nth-child(15) { grid-column: span 3; grid-row: span 3; }
    .fc:nth-child(16) { grid-column: span 2; grid-row: span 2; }
    .fc:nth-child(17) { grid-column: span 4; grid-row: span 3; }
    .fc:nth-child(18) { grid-column: span 3; grid-row: span 2; }
    /* Row 6 */
    .fc:nth-child(19) { grid-column: span 6; grid-row: span 3; }
    .fc:nth-child(20) { grid-column: span 6; grid-row: span 3; }
  </style>
</head>
<body>

  <canvas id="dust-canvas"></canvas>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link nav-link">← [HOME]</a>
      <span class="separator">//</span>
      <span class="page-title">[BASE\\LABORATORY]</span>
    </div>
    <div class="header-right" id="version-tag">[Version\1.0.0]</div>
  </header>

  <main>
    <div class="section-label">// WORK IN PROGRESS — ACTIVE EXPERIMENTS</div>
    <div class="film-grid" id="film-grid"></div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/dust.js"></script>
  <script>
    const grid = document.getElementById('film-grid');
    for (let i = 1; i <= 20; i++) {
      const num = String(i).padStart(3, '0');
      const card = document.createElement('div');
      card.className = 'fc';
      card.innerHTML = `
        <div class="card-placeholder">[ NO SIGNAL ]</div>
        <div class="card-info">
          <div class="card-code">WIP_${num} //</div>
          <div class="card-name">AWAITING_INPUT</div>
          <div class="card-status"><div class="status-dot"></div><span class="status-text">DORMANT</span></div>
        </div>`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
