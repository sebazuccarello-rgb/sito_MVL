<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVL // BASE\LABORATORY</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 20% 0%,   rgba(0,90,100,0.28) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%,  rgba(140,20,20,0.22) 0%, transparent 55%),
        #080808;
      overflow-x: hidden;
    }

    #dust-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(8,8,8,0.88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 24px; }
    .back-link { font-size: 10px; letter-spacing: 0.18em; color: var(--text-dim); transition: color 0.2s; }
    .back-link:hover { color: var(--teal); }
    .page-title { font-family: 'Prototype', var(--font); font-size: 13px; letter-spacing: 0.28em; color: var(--teal); }
    .separator { color: var(--text-dim); }
    .header-right { font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim); }

    main {
      position: relative;
      z-index: 2;
      padding: 40px 40px 80px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── DESK SURFACE ── */
    .desk {
      position: relative;
      width: 100%;
      min-height: 180vh;
    }

    /* ── CARD ── */
    .project-card {
      position: absolute;
      background: #060606;
      border: 8px solid #000;
      cursor: pointer;
      transition: transform 0.3s ease, z-index 0s, box-shadow 0.3s;
      box-shadow: 2px 4px 16px rgba(0,0,0,0.8);
    }
    .project-card:hover {
      z-index: 200 !important;
      box-shadow: 6px 10px 32px rgba(0,0,0,0.95);
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .card-media {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.45) brightness(0.65);
      transition: filter 0.4s;
    }
    .project-card:hover .card-media { filter: saturate(0.85) brightness(0.88); }

    .card-placeholder {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090909;
      color: #1c1c1c;
      font-size: 8px;
      letter-spacing: 0.22em;
    }

    .card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 10px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      z-index: 2;
    }
    .card-code { font-size: 7px; letter-spacing: 0.28em; color: var(--teal); margin-bottom: 2px; }
    .card-name {
      font-family: 'Prototype', var(--font);
      font-size: 11px; letter-spacing: 0.1em;
      color: var(--text); text-transform: uppercase;
    }
    .card-status { margin-top: 4px; display: flex; align-items: center; gap: 5px; }
    .status-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--red); box-shadow: 0 0 4px var(--red);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-text { font-size: 6px; letter-spacing: 0.22em; color: var(--text-dim); }
  </style>
</head>
<body>

  <canvas id="dust-canvas"></canvas>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link nav-link">← [HOME]</a>
      <span class="separator">//</span>
      <span class="page-title">[BASE\\LABORATORY]</span>
    </div>
    <div class="header-right" id="version-tag">[Version\1.0.0]</div>
  </header>

  <main>
    <div class="section-label">// WORK IN PROGRESS — ACTIVE EXPERIMENTS</div>
    <div class="desk" id="desk"></div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/dust.js"></script>
  <script>
    const desk = document.getElementById('desk');
    const W = desk.offsetWidth || window.innerWidth - 80;

    const sizes = [
      {w:280,h:190},{w:340,h:220},{w:260,h:195},{w:320,h:210},
      {w:300,h:180},{w:360,h:230},{w:270,h:195},{w:310,h:205},
      {w:290,h:185},{w:350,h:225},{w:265,h:200},{w:330,h:215},
      {w:285,h:190},{w:345,h:220},{w:275,h:200},{w:315,h:210},
      {w:295,h:185},{w:355,h:225},{w:268,h:195},{w:325,h:210},
    ];

    /* spread cards across the desk in a loose grid with random jitter */
    const cols = 4;
    const cellW = W / cols;

    sizes.forEach((s, i) => {
      const col  = i % cols;
      const row  = Math.floor(i / cols);
      const jitX = (Math.random() - 0.5) * cellW * 0.55;
      const jitY = (Math.random() - 0.5) * 80;
      const top  = row * 260 + 20 + jitY;
      const left = col * cellW + (cellW - s.w) / 2 + jitX;
      const rot  = (Math.random() * 14 - 7).toFixed(2);
      const z    = Math.floor(Math.random() * 20) + 1;
      const num  = String(i + 1).padStart(3, '0');

      const card = document.createElement('div');
      card.className = 'project-card';
      card.style.cssText = `
        width:${s.w}px; height:${s.h}px;
        top:${top}px; left:${Math.max(0, left)}px;
        transform:rotate(${rot}deg);
        z-index:${z};
      `;
      card.innerHTML = `
        <div class="card-inner"><div class="card-placeholder">[ NO SIGNAL ]</div></div>
        <div class="card-info">
          <div class="card-code">WIP_${num} //</div>
          <div class="card-name">AWAITING_INPUT</div>
          <div class="card-status"><div class="status-dot"></div><span class="status-text">DORMANT</span></div>
        </div>`;

      card.addEventListener('mouseenter', () => {
        card.style.transform = `rotate(0deg) translateY(-8px)`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = `rotate(${rot}deg)`;
      });

      desk.appendChild(card);
    });

    /* set desk height to fit all cards */
    const rows = Math.ceil(sizes.length / cols);
    desk.style.minHeight = (rows * 260 + 280) + 'px';
  </script>
</body>
</html>
