<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVL // CONTROL</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      overflow: hidden;
      height: 100%;
    }

    /* ── BACKGROUND ── */
    .bg {
      position: fixed;
      inset: 0;
      background: url('assets/occhio.png') center center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(8,8,8,0.15) 0%, rgba(8,8,8,0.55) 100%);
    }

    /* ── SHELL ── */
    .shell {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
    }

    /* ── NAV LINKS — no box, plain text ── */
    .nav-link {
      font-family: var(--font);
      font-size: 21px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
      background: none;
      border: none;
      padding: 0;
      white-space: nowrap;
      transition: color 0.25s;
    }
    .nav-link:hover { color: var(--teal); }

    /* ── TOP-LEFT: polaroid ── */
    .logo-polaroid {
      position: absolute;
      top: 24px;
      left: 28px;
      width: 165px;
      animation: flicker 8s infinite;
    }
    .logo-polaroid img { width: 100%; }

    /* ── TOP-CENTER: [BASE\\LABORATORY] ── */
    .nav-top {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* ── TOP-RIGHT: badges ── */
    .sys-badges {
      position: absolute;
      top: 28px;
      right: 32px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .badge {
      font-family: var(--font);
      font-size: 21px;
      letter-spacing: 0.18em;
      color: var(--text);
      cursor: default;
      transition: color 0.2s;
    }
    .badge.login { cursor: pointer; }
    .badge.login:hover { color: var(--red); }
    .badge:not(.login):hover { color: var(--teal); }

    /* ── CENTER: logo with scan frame ── */
    .center-block {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* scan rectangle */
    .scan-frame {
      position: relative;
      padding: 24px 36px;
      border: 1.5px solid rgba(100, 200, 220, 0.65);
      box-shadow:
        0 0 18px rgba(0,180,200,0.12),
        inset 0 0 24px rgba(0,180,200,0.04);
    }

    /* corner accents */
    .scan-frame::before,
    .scan-frame::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--teal);
      border-style: solid;
    }
    .scan-frame::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
    }
    .scan-frame::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
    }

    .center-logo {
      width: 390px;
      display: block;
      filter: drop-shadow(0 2px 20px rgba(0,0,0,0.5));
    }

    /* ── MIDDLE-LEFT ── */
    .nav-left {
      position: absolute;
      top: 50%;
      left: 32px;
      transform: translateY(-50%);
    }

    /* ── MIDDLE-RIGHT ── */
    .nav-right {
      position: absolute;
      top: 50%;
      right: 32px;
      transform: translateY(-50%);
    }

    /* ── BOTTOM-CENTER ── */
    .nav-bottom {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* ── BOTTOM-LEFT: quote ── */
    .quote {
      position: absolute;
      bottom: 60px;
      left: 32px;
      font-family: var(--font);
      font-size: 27px;
      line-height: 1.7;
      color: var(--text);
      max-width: 280px;
    }

    /* ── BOTTOM-RIGHT: system data ── */
    .system-data {
      position: absolute;
      bottom: 32px;
      right: 32px;
      font-family: var(--font);
      font-size: 15px;
      letter-spacing: 0.16em;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.2s;
    }
    .system-data:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="shell">

    <!-- top-left polaroid -->
    <div class="logo-polaroid">
      <img src="assets/rettangolo11.png" alt="MVL">
    </div>

    <!-- top-center -->
    <div class="nav-top">
      <a href="laboratory.html" class="nav-link">[BASE\\LABORATORY]</a>
    </div>

    <!-- top-right badges -->
    <div class="sys-badges">
      <div class="badge login">[LOG_ID]</div>
      <div class="badge" id="version-tag">[Version\1.0.0]</div>
    </div>

    <!-- center logo with scan frame -->
    <div class="center-block">
      <div class="scan-frame">
        <img src="assets/1x/Risorsa 5.png" alt="MVL Logo" class="center-logo">
      </div>
    </div>

    <!-- middle-left -->
    <div class="nav-left">
      <a href="vision.html" class="nav-link">[WORLD\\THE_VISION]</a>
    </div>

    <!-- middle-right -->
    <div class="nav-right">
      <a href="vault.html" class="nav-link">[SCAN\\THE_VAULT]</a>
    </div>

    <!-- bottom-center -->
    <div class="nav-bottom">
      <a href="raw-idea.html" class="nav-link">[STATUS\\RAW_IDEA]</a>
    </div>

    <!-- bottom-left quote -->
    <div class="quote">
      "Don't tell me<br>what you want,<br>tell me your<br>Vision"
    </div>

    <!-- bottom-right system data -->
    <div class="system-data">[SYSTEM.DATA // PRIVACY &amp; COOKIES]</div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
