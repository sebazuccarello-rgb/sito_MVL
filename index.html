<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MVL // CONTROL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      overflow: hidden;
      height: 100%;
      height: 100dvh;
    }

    /* ── BACKGROUND ── */
    .bg {
      position: fixed;
      inset: 0;
      background: url('assets/occhio.png') center center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(8,8,8,0.15) 0%, rgba(8,8,8,0.55) 100%);
    }

    /* ── SHELL ── */
    .shell {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* ── NAV LINKS — tutto in vw per scaling proporzionale ── */
    .nav-link {
      font-family: 'Prototype', var(--font);
      font-size: min(2.22vw, 32px);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--text);
      background: none;
      border: none;
      padding: 0;
      white-space: nowrap;
      transition: color 0.25s;
    }
    .nav-link:hover {
      color: var(--teal);
      animation: glitch 0.4s steps(1) infinite;
    }

    @keyframes glitch {
      0%   { text-shadow: none; transform: translate(0); }
      20%  { text-shadow: -2px 0 var(--red), 2px 0 var(--teal); transform: translate(-1px, 0); }
      40%  { text-shadow: 2px 0 var(--red), -2px 0 var(--teal); transform: translate(1px, 0); clip-path: inset(10% 0 80% 0); }
      60%  { text-shadow: none; transform: translate(0); clip-path: none; }
      70%  { text-shadow: -3px 0 var(--teal); transform: translate(2px, 1px); }
      80%  { text-shadow: 3px 0 var(--red); transform: translate(-1px, 0); clip-path: inset(60% 0 20% 0); }
      100% { text-shadow: none; transform: translate(0); clip-path: none; }
    }

    /* ── TOP-LEFT: polaroid ── */
    .logo-polaroid {
      position: absolute;
      top: min(1.67vw, 24px);
      left: min(1.94vw, 28px);
      width: min(22.4vw, 322px);
      transform: rotate(-6deg);
    }
    .logo-polaroid img { width: 100%; }

    /* ── TOP-CENTER ── */
    .nav-top {
      position: absolute;
      top: min(2.22vw, 32px);
      left: 50%;
      transform: translateX(-50%);
    }

    /* ── TOP-RIGHT: badge versione ── */
    .sys-badges {
      position: absolute;
      top: min(1.94vw, 28px);
      right: min(2.22vw, 32px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .badge {
      font-family: 'Prototype', var(--font);
      font-size: min(2.22vw, 32px);
      letter-spacing: 0.18em;
      color: var(--text);
      cursor: default;
      transition: color 0.2s;
    }

    /* ── CENTER: logo ── */
    .center-block {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scan-frame {
      position: relative;
      padding: min(1.67vw, 24px) min(2.5vw, 36px);
    }
    .center-logo {
      width: min(40.6vw, 585px);
      display: block;
      filter: drop-shadow(0 2px 20px rgba(0,0,0,0.5));
    }

    /* ── MIDDLE-LEFT ── */
    .nav-left {
      position: absolute;
      top: 50%;
      left: min(2.22vw, 32px);
      transform: translateY(-50%);
    }

    /* ── MIDDLE-RIGHT ── */
    .nav-right {
      position: absolute;
      top: 50%;
      right: min(2.22vw, 32px);
      transform: translateY(-50%);
    }

    /* ── BOTTOM-CENTER ── */
    .nav-bottom {
      position: absolute;
      bottom: min(2.22vw, 32px);
      left: 50%;
      transform: translateX(-50%);
    }

    /* ── BOTTOM-LEFT: quote ── */
    .quote {
      position: absolute;
      bottom: min(4.17vw, 60px);
      left: min(2.22vw, 32px);
      font-family: 'PunkBabe', var(--font);
      font-size: min(5.56vw, 80px);
      line-height: 0.95;
      color: var(--text);
      max-width: min(36.1vw, 520px);
    }

    /* ── BOTTOM-RIGHT: privacy link ── */
    .system-data {
      position: absolute;
      bottom: min(2.22vw, 32px);
      right: min(2.22vw, 32px);
      font-family: var(--font);
      font-size: min(1.6vw, 23px);
      letter-spacing: 0.16em;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.2s;
      text-decoration: none;
    }
    .system-data:hover { color: var(--red); }

    /* ── MOBILE (≤768px) — layout flex colonna ── */
    @media (max-width: 768px) {
      /* Shell diventa flex colonna centrata */
      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }

      /* sys-badges rimane assoluto in alto a destra */
      .sys-badges {
        position: absolute;
        top: 14px; right: 14px;
        gap: 3px;
      }
      .badge { font-size: 11px; letter-spacing: 0.12em; }

      /* Nascondi decorativi */
      .logo-polaroid, .quote, .system-data { display: none; }

      /* Nav e logo escono dal flusso assoluto → entrano nel flex */
      .nav-top, .nav-left, .nav-right, .nav-bottom {
        position: static;
        transform: none;
        flex-shrink: 0;
      }
      .center-block {
        position: static;
        transform: none;
        flex-shrink: 0;
      }

      /* Ordine: LABORATORY, THE_VAULT, logo, THE_VISION, RAW_IDEA */
      .nav-top    { order: 1; }
      .nav-right  { order: 2; }
      .center-block { order: 3; }
      .nav-left   { order: 4; }
      .nav-bottom { order: 5; }

      .nav-link { font-size: 12px; letter-spacing: 0.16em; }
      .center-logo { width: 62vw; }
      .scan-frame { padding: 8px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-link:hover { animation: none; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="shell">

    <!-- top-left polaroid -->
    <div class="logo-polaroid">
      <img src="assets/rettangolo11.png" alt="MVL">
    </div>

    <!-- top-center -->
    <div class="nav-top">
      <a href="laboratory.html" class="nav-link">[BASE\\LABORATORY]</a>
    </div>

    <!-- top-right badge -->
    <div class="sys-badges">
      <div class="badge" id="version-tag">[Version\1.0.0]</div>
    </div>

    <!-- center logo with scan frame -->
    <div class="center-block">
      <div class="scan-frame">
        <img src="assets/1x/Risorsa 5.png" alt="MVL Logo" class="center-logo">
      </div>
    </div>

    <!-- middle-left -->
    <div class="nav-left">
      <a href="vision.html" class="nav-link">[WORLD\\THE_VISION]</a>
    </div>

    <!-- middle-right -->
    <div class="nav-right">
      <a href="vault.html" class="nav-link">[SCAN\\THE_VAULT]</a>
    </div>

    <!-- bottom-center -->
    <div class="nav-bottom">
      <a href="raw-idea.html" class="nav-link">[STATUS\\RAW_IDEA]</a>
    </div>

    <!-- bottom-left quote -->
    <div class="quote">
      "Don't tell me<br>what you want,<br>tell me your<br>Vision"
    </div>

    <!-- bottom-right privacy link -->
    <a href="privacy.html" class="system-data">[SYSTEM.DATA // PRIVACY &amp; COOKIES]</a>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
