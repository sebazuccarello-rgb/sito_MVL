<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVL // CONTROL</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      overflow: hidden;
      height: 100%;
    }

    /* ── BACKGROUND ── */
    .bg {
      position: fixed;
      inset: 0;
      background: url('assets/occhio.png') center center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(8,8,8,0.35) 0%, rgba(8,8,8,0.78) 100%);
    }

    /* ── LAYOUT ── */
    .shell {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
    }

    /* ── TOP-LEFT: polaroid logo ── */
    .logo {
      position: absolute;
      top: 28px;
      left: 32px;
      width: 90px;
      opacity: 0.92;
      animation: flicker 8s infinite;
    }
    .logo img { width: 100%; }

    /* ── TOP-RIGHT: system badges ── */
    .sys-badges {
      position: absolute;
      top: 28px;
      right: 32px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .badge {
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 5px 10px;
      cursor: default;
      transition: color 0.2s, border-color 0.2s;
    }
    .badge:hover {
      color: var(--teal);
      border-color: var(--teal-dim);
    }
    .badge.login { cursor: pointer; }
    .badge.login:hover { color: var(--red); border-color: var(--red-dim); }

    /* ── CROSS NAVIGATION ── */
    /* top */
    .nav-top {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
    }
    /* bottom */
    .nav-bottom {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
    }
    /* left */
    .nav-left {
      position: absolute;
      top: 50%;
      left: 52px;
      transform: translateY(-50%);
    }
    /* right */
    .nav-right {
      position: absolute;
      top: 50%;
      right: 52px;
      transform: translateY(-50%);
    }

    /* crosshair lines */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .crosshair::before,
    .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(208,208,208,0.06);
    }
    .crosshair::before {
      width: 1px;
      height: 100vh;
      left: 0;
      top: 50%;
      transform: translate(-50%, -50vh);
    }
    .crosshair::after {
      height: 1px;
      width: 100vw;
      top: 0;
      left: 50%;
      transform: translate(-50vw, -50%);
    }

    /* center dot */
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 10px var(--teal);
      pointer-events: none;
    }

    /* nav link override for home */
    .nav-link {
      font-size: 10px;
      letter-spacing: 0.22em;
      border-color: transparent;
      background: rgba(8,8,8,0.45);
      backdrop-filter: blur(2px);
      white-space: nowrap;
    }
    .nav-link:hover {
      background: rgba(8,8,8,0.7);
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="shell">

    <!-- crosshair -->
    <div class="crosshair"></div>
    <div class="center-dot"></div>

    <!-- top-left logo -->
    <div class="logo">
      <img src="assets/rettangolo11.png" alt="MVL">
    </div>

    <!-- top-right badges -->
    <div class="sys-badges">
      <div class="badge login">[LOG_ID]</div>
      <div class="badge" id="version-tag">[Version\1.0.0]</div>
    </div>

    <!-- navigation cross -->
    <div class="nav-top">
      <a href="laboratory.html" class="nav-link">[BASE\\LABORATORY]</a>
    </div>
    <div class="nav-right">
      <a href="vault.html" class="nav-link">[SCAN\\THE_VAULT]</a>
    </div>
    <div class="nav-bottom">
      <a href="raw-idea.html" class="nav-link">[STATUS\\RAW_IDEA]</a>
    </div>
    <div class="nav-left">
      <a href="vision.html" class="nav-link">[WORLD\\THE_VISION]</a>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
